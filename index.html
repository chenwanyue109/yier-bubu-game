  }
}

function drawCoopBond(){
  if(game.bossActive) return;
  const a = game.players[0];
  const b = game.players[1];
  if(a.dead || b.dead) return;
  const gap = Math.abs(a.cx - b.cx);
  if(gap < 560) return;

  const left = a.cx < b.cx ? a : b;
  const right = left === a ? b : a;
  const x1 = left.cx;
  const x2 = right.cx;
  const y1 = left.feet - 28;
  const y2 = right.feet - 28;
  const midX = (x1 + x2) / 2;
  const midY = (y1 + y2) / 2 + Math.min(40, gap * .04);
  const alpha = clamp((gap - 560) / 240, 0, .55);

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = '#fff1ad';
  ctx.lineWidth = 3;
  ctx.setLineDash([4, 11]);
  ctx.lineDashOffset = -game.time * 38;
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.quadraticCurveTo(midX, midY, x2, y2);
  ctx.stroke();
  ctx.setLineDash([]);

  for(let i = 1; i <= 4; i++){
    const t = i / 5;
    const x = (1 - t) * (1 - t) * x1 + 2 * (1 - t) * t * midX + t * t * x2;
    const y = (1 - t) * (1 - t) * y1 + 2 * (1 - t) * t * midY + t * t * y2;
    ctx.fillStyle = i % 2 ? '#fff2a2' : '#ffd1df';
    starPath(x, y + Math.sin(game.time * 3 + i) * 3, 4.5, 1.9, 5, game.time + i);
    ctx.fill();
  }
  ctx.restore();
}

function drawPlayers(){
  for(const p of game.players){
    const cx = p.cx;
    if(cx < game.cameraX - 140 || cx > game.cameraX + W + 140) continue;
    drawPlayerFigure(p, cx, p.feet, 1.15);
  }
}

function drawPortrait(p, cx, cy, r){
  const pal = p.pal;
  const lw = Math.max(1.6, r * .07);
  const sprite = PLAYER_SPRITES[p.id];

  // 头像也直接使用参考图原图
  if(sprite && sprite.ready){
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.clip();
    ctx.fillStyle = p.id === 1 ? '#fff3f6' : '#fff0df';
    ctx.fillRect(cx - r, cy - r, r * 2, r * 2);

    const sw = sprite.img.naturalWidth;
    const sh = sprite.img.naturalHeight;
    const scale = Math.min((r * 1.84) / sw, (r * 1.84) / sh);
    const dw = sw * scale;
    const dh = sh * scale;
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(sprite.img, cx - dw / 2, cy - dh / 2 + r * .02, dw, dh);
    ctx.restore();

    ctx.strokeStyle = 'rgba(255,255,255,.9)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(cx, cy, r - 1.5, 0, Math.PI * 2);
    ctx.stroke();
    ctx.strokeStyle = p.id === 1 ? '#ffc2d0' : '#e2b691';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.stroke();
    return;
  }

  ctx.save();
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.clip();
  ctx.fillStyle = p.id === 1 ? '#fff3f6' : '#fff0df';
  ctx.fillRect(cx - r, cy - r, r * 2, r * 2);

  // 兜帽外层与内衬
  ctx.fillStyle = pal.hoodOuter;
  ctx.strokeStyle = pal.outline;
  ctx.lineWidth = lw;
  ctx.beginPath();
  ctx.ellipse(cx, cy + r * .02, r * .78, r * .74, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = pal.hoodInner;
  ctx.beginPath();
  ctx.ellipse(cx, cy + r * .02, r * .72, r * .68, 0, 0, Math.PI * 2);
  ctx.fill();

  if(p.id === 1){
    // 一二兜帽顶端的青色星星
    ctx.fillStyle = pal.hoodOuter;
    ctx.strokeStyle = pal.outline;
    ctx.lineWidth = Math.max(1.3, r * .055);
    ctx.beginPath();
    ctx.ellipse(cx, cy - r * .72, r * .18, r * .12, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = pal.hoodInner;
    ctx.lineWidth = Math.max(1.1, r * .045);
    starPath(cx, cy - r * .78, r * .13, r * .055, 5, -Math.PI / 2);
    ctx.fill();
    ctx.stroke();
  }else{
    // 布布兜帽顶端的黄色小冠
    ctx.fillStyle = pal.hoodInner;
    ctx.strokeStyle = pal.outline;
    ctx.lineWidth = Math.max(1.3, r * .055);
    ctx.beginPath();
    ctx.moveTo(cx - r * .15, cy - r * .69);
    ctx.lineTo(cx - r * .17, cy - r * .80);
    ctx.quadraticCurveTo(cx - r * .06, cy - r * .76, cx - r * .01, cy - r * .85);
    ctx.quadraticCurveTo(cx + r * .04, cy - r * .76, cx + r * .16, cy - r * .80);
    ctx.lineTo(cx + r * .14, cy - r * .69);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  }

  // 圆耳朵：布布的耳罩是粉色的
  ctx.fillStyle = p.id === 1 ? pal.ear : pal.hoodEar;
  ctx.strokeStyle = pal.outline;
  ctx.lineWidth = lw;
  const earR = r * (p.id === 1 ? .235 : .22);
  ctx.beginPath();
  ctx.arc(cx - r * .45, cy - r * .47, earR, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(cx + r * .45, cy - r * .47, earR, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = p.id === 1 ? pal.earInner : '#ffc4c6';
  ctx.beginPath();
  ctx.arc(cx - r * .45, cy - r * .46, r * .105, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(cx + r * .45, cy - r * .46, r * .105, 0, Math.PI * 2);
  ctx.fill();

  // 大脑袋
  ctx.fillStyle = pal.body;
  ctx.strokeStyle = pal.outline;
  ctx.lineWidth = lw;
  ctx.beginPath();
  ctx.ellipse(cx, cy + r * .02, r * .68, r * .64, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  // 兜帽盖住头顶的帽檐
  ctx.fillStyle = pal.hoodOuter;
  ctx.beginPath();
  ctx.moveTo(cx - r * .70, cy - r * .14);
  ctx.bezierCurveTo(cx - r * .76, cy - r * .52, cx - r * .44, cy - r * .70, cx, cy - r * .70);
  ctx.bezierCurveTo(cx + r * .44, cy - r * .70, cx + r * .76, cy - r * .52, cx + r * .70, cy - r * .14);
  ctx.quadraticCurveTo(cx + r * .35, cy - r * .28, cx, cy - r * .30);
  ctx.quadraticCurveTo(cx - r * .35, cy - r * .28, cx - r * .70, cy - r * .14);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = pal.outline;
  ctx.lineWidth = lw;
  ctx.beginPath();
  ctx.moveTo(cx - r * .70, cy - r * .14);
  ctx.quadraticCurveTo(cx - r * .35, cy - r * .28, cx, cy - r * .30);
  ctx.quadraticCurveTo(cx + r * .35, cy - r * .28, cx + r * .70, cy - r * .14);
  ctx.stroke();
  ctx.strokeStyle = pal.hoodInner;
  ctx.lineWidth = Math.max(2.2, r * .085);
  ctx.beginPath();
  ctx.moveTo(cx - r * .63, cy - r * .18);
  ctx.quadraticCurveTo(cx - r * .30, cy - r * .32, cx, cy - r * .34);
  ctx.quadraticCurveTo(cx + r * .30, cy - r * .32, cx + r * .63, cy - r * .18);
  ctx.stroke();

  // 腮红
  ctx.save();
  ctx.globalAlpha = .82;
  ctx.fillStyle = pal.blush;
  ctx.beginPath();
  ctx.ellipse(cx - r * .40, cy + r * .18, r * .17, r * .10, -.06, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(cx + r * .40, cy + r * .18, r * .17, r * .10, .06, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // 一二的小眉毛
  if(p.id === 1){
    ctx.strokeStyle = '#2d2321';
    ctx.lineWidth = Math.max(1.1, r * .05);
    ctx.beginPath();
    ctx.moveTo(cx - r * .30, cy - r * .16);
    ctx.lineTo(cx - r * .15, cy - r * .12);
    ctx.moveTo(cx + r * .30, cy - r * .16);
    ctx.lineTo(cx + r * .15, cy - r * .12);
    ctx.stroke();
  }

  // 黑豆眼
  ctx.fillStyle = p.id === 1 ? '#2d2321' : '#3b231b';
  ctx.beginPath();
  ctx.ellipse(cx - r * .23, cy - r * .06, r * .095, r * .135, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(cx + r * .23, cy - r * .06, r * .095, r * .135, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.92)';
  ctx.beginPath();
  ctx.arc(cx - r * .255, cy - r * .11, r * .032, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(cx + r * .205, cy - r * .11, r * .032, 0, Math.PI * 2);
  ctx.fill();

  // 小嘴
  if(p.id === 1){
    ctx.strokeStyle = '#2d2321';
    ctx.lineWidth = Math.max(1.3, r * .065);
    ctx.beginPath();
    ctx.moveTo(cx - r * .16, cy + r * .20);
    ctx.quadraticCurveTo(cx - r * .08, cy + r * .29, cx, cy + r * .20);
    ctx.quadraticCurveTo(cx + r * .08, cy + r * .29, cx + r * .16, cy + r * .20);
    ctx.stroke();

    // 领巾
    ctx.fillStyle = pal.scarf;
    ctx.beginPath();
    ctx.moveTo(cx - r * .43, cy + r * .47);
    ctx.quadraticCurveTo(cx, cy + r * .57, cx + r * .43, cy + r * .47);
    ctx.lineTo(cx + r * .40, cy + r * .57);
    ctx.quadraticCurveTo(cx, cy + r * .66, cx - r * .40, cy + r * .57);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(cx - r * .12, cy + r * .62, r * .12, r * .085, -.28, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(cx + r * .12, cy + r * .62, r * .12, r * .085, .28, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(cx, cy + r * .61, r * .065, 0, Math.PI * 2);
    ctx.fill();
  }else{
    ctx.fillStyle = '#543026';
    ctx.beginPath();
    ctx.moveTo(cx - r * .11, cy + r * .18);
    ctx.bezierCurveTo(cx - r * .13, cy + r * .33, cx - r * .06, cy + r * .37, cx, cy + r * .37);
    ctx.bezierCurveTo(cx + r * .06, cy + r * .37, cx + r * .13, cy + r * .33, cx + r * .11, cy + r * .18);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#f0939a';
    ctx.beginPath();
    ctx.ellipse(cx, cy + r * .315, r * .07, r * .05, 0, 0, Math.PI * 2);
    ctx.fill();

    // 小蓝剑与白布带
    ctx.fillStyle = pal.sword;
    ctx.strokeStyle = pal.outline;
    ctx.lineWidth = Math.max(1.2, r * .05);
    ctx.beginPath();
    ctx.moveTo(cx - r * .58, cy + r * .48);
    ctx.quadraticCurveTo(cx - r * .63, cy + r * .55, cx - r * .56, cy + r * .61);
    ctx.lineTo(cx - r * .16, cy + r * .58);
    ctx.lineTo(cx - r * .16, cy + r * .52);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#674536';
    ctx.lineWidth = Math.max(1, r * .04);
    roundRectPath(cx - r * .16, cy + r * .50, r * .10, r * .10, r * .03);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = pal.cloth;
    ctx.lineWidth = Math.max(1.1, r * .045);
    ctx.beginPath();
    ctx.moveTo(cx + r * .18, cy + r * .49);
    ctx.bezierCurveTo(cx + r * .36, cy + r * .47, cx + r * .53, cy + r * .52, cx + r * .62, cy + r * .60);
    ctx.quadraticCurveTo(cx + r * .64, cy + r * .66, cx + r * .56, cy + r * .64);
    ctx.bezierCurveTo(cx + r * .43, cy + r * .56, cx + r * .32, cy + r * .56, cx + r * .22, cy + r * .59);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  }
  ctx.restore();

  ctx.strokeStyle = 'rgba(255,255,255,.9)';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(cx, cy, r - 1.5, 0, Math.PI * 2);
  ctx.stroke();
  ctx.strokeStyle = p.id === 1 ? '#ffc2d0' : '#e2b691';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.stroke();
}

function drawWalker(e){
  const x = e.x;
  const feet = e.y;
  const bob = Math.sin(game.time * 4.1 + e.phase) * 1.8;
  const flash = e.flash > 0;
  ctx.save();
  ctx.translate(x, feet + bob);

  // 影子
  ctx.globalAlpha = .14;
  ctx.fillStyle = '#201827';
  ctx.beginPath();
  ctx.ellipse(0, 2, 18, 5, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;

  // 脚
  ctx.fillStyle = flash ? '#ffffff' : '#5b3c72';
  ctx.beginPath();
  ctx.ellipse(-8, -4, 6, 4, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(8, -4, 6, 4, 0, 0, Math.PI * 2);
  ctx.fill();

  // 身体
  ctx.fillStyle = flash ? '#ffffff' : '#9b6ec9';
  ctx.strokeStyle = '#4a2d62';
  ctx.lineWidth = 2.2;
  ctx.beginPath();
  ctx.ellipse(0, -18, 17, 15, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  // 小角
  ctx.fillStyle = flash ? '#ffffff' : '#6f4a8f';
  ctx.beginPath();
  ctx.moveTo(-11, -30);
  ctx.lineTo(-6, -39);
  ctx.lineTo(-2, -29);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(11, -30);
  ctx.lineTo(6, -39);
  ctx.lineTo(2, -29);
  ctx.closePath();
  ctx.fill();

  // 眼睛
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.ellipse(-6, -20, 4.3, 5, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(6, -20, 4.3, 5, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#37203f';
  ctx.beginPath();
  ctx.arc(-5.4, -19.5, 2, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(6.6, -19.5, 2, 0, Math.PI * 2);
  ctx.fill();

  // 怒眉
  ctx.strokeStyle = '#4a2d62';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-10, -28);
  ctx.lineTo(-3, -26);
  ctx.moveTo(10, -28);
  ctx.lineTo(3, -26);
  ctx.stroke();

  // 嘴巴
  ctx.fillStyle = '#4a2d62';
  ctx.beginPath();
  ctx.ellipse(0, -10, 4.2, 2.6, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.moveTo(-3, -11);
  ctx.lineTo(-1, -7.5);
  ctx.lineTo(1, -11);
  ctx.closePath();
  ctx.fill();

function drawFlyer(e){
  const x = e.x;
  const y = e.y;
  const wing = Math.sin(game.time * 13 + e.phase) * 9;
  ctx.save();
  ctx.translate(x, y);

  // 影子（弱）
  ctx.globalAlpha = .08;
  ctx.fillStyle = '#2b2134';
  ctx.beginPath();
  ctx.ellipse(0, 36, 13, 4, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;

  // 翅膀
  ctx.fillStyle = 'rgba(255,182,113,.82)';
  ctx.strokeStyle = '#6e3d2b';
  ctx.lineWidth = 1.8;
  ctx.beginPath();
  ctx.moveTo(-12, -2);
  ctx.quadraticCurveTo(-35, -15 - wing, -31, 7);
  ctx.quadraticCurveTo(-23, 10, -12, 6);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(12, -2);
  ctx.quadraticCurveTo(35, -15 - wing, 31, 7);
  ctx.quadraticCurveTo(23, 10, 12, 6);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // 身体
  ctx.fillStyle = e.flash > 0 ? '#fff' : '#e98b4f';
  ctx.strokeStyle = '#6e3d2b';
  ctx.lineWidth = 2.2;
  ctx.beginPath();
  ctx.ellipse(0, 0, 15, 15, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  // 耳朵
  ctx.fillStyle = '#e98b4f';
  ctx.beginPath();
  ctx.moveTo(-11, -9);
  ctx.lineTo(-8, -20);
  ctx.lineTo(-2, -12);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(11, -9);
  ctx.lineTo(8, -20);
  ctx.lineTo(2, -12);
  ctx.closePath();
  ctx.fill();

  // 眼睛
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(-5.5, -3, 3.7, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(5.5, -3, 3.7, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#432b25';
  ctx.beginPath();
  ctx.arc(-5.2, -2.5, 1.7, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(5.8, -2.5, 1.7, 0, Math.PI * 2);
  ctx.fill();

  // 嘴
  ctx.strokeStyle = '#5a3127';
  ctx.lineWidth = 1.8;
  ctx.beginPath();
  ctx.arc(0, 5, 4, .15, Math.PI - .15);
  ctx.stroke();
  ctx.restore();
}

function drawEnemies(){
  for(const e of game.enemies){
    if(!e.alive) continue;
    if(e.x < game.cameraX - 100 || e.x > game.cameraX + W + 100) continue;
    if(e.type === 'walker') drawWalker(e); else drawFlyer(e);
  }
}

function drawBoss(){
  const b = game.boss;
  if(!b) return;
  if(b.x > game.cameraX + W + 220 || b.x + b.w < game.cameraX - 220) return;
  if(!b.active && !b.dead) return;

  const t = game.time;
  const deadP = b.dead ? clamp(1 - b.deathTimer / 2.9, 0, 1) : 0;
  const bob = b.dead ? Math.sin(t * 34) * 5 : Math.sin(t * 2.2) * 4;
  const cx = b.cx;
  const feet = b.y + b.h;
  const bodyCY = b.y + b.h * .55 + bob;

  if(b.dead && deadP > .92) return;

  // 影子
  ctx.save();
  ctx.globalAlpha = .20;
  ctx.fillStyle = '#1e1526';
  ctx.beginPath();
  ctx.ellipse(cx, GROUND_Y + 4, 82, 13, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // 光环 / 警告
  ctx.save();
  const aura = ctx.createRadialGradient(cx, bodyCY, 30, cx, bodyCY, 145);
  aura.addColorStop(0, b.chargeWindup > 0 ? 'rgba(255,98,96,.23)' : 'rgba(137,90,214,.19)');
  aura.addColorStop(1, 'rgba(137,90,214,0)');
  ctx.fillStyle = aura;
  ctx.beginPath();
  ctx.arc(cx, bodyCY, 145, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.translate(cx, bodyCY);
  if(b.dead){
    ctx.rotate(Math.sin(t * 40) * .08 * (1 - deadP));
    ctx.globalAlpha = 1 - deadP * .95;
  }
  if(b.intro > 0){
    const p = 1 - b.intro / 2.1;
    const s = easeOutBack(clamp(p * 1.5, 0, 1));
    ctx.scale(.5 + s * .5, .5 + s * .5);
  }

  // 触手 / 小脚
  ctx.fillStyle = b.flash > 0 ? '#ffffff' : '#4d326d';
  ctx.strokeStyle = '#2f1e47';
  ctx.lineWidth = 3;
  for(let i = -2; i <= 2; i++){
    ctx.beginPath();
    ctx.ellipse(i * 27, b.h * .45, 11, 8 + (i % 2) * 2, i * .08, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
  }

  // 手臂
  ctx.fillStyle = b.flash > 0 ? '#ffffff' : '#5c3f82';
  ctx.beginPath();
  ctx.ellipse(-93, 3, 23, 38, -.35, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  ctx.beginPath();
  ctx.ellipse(93, 3, 23, 38, .35, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  // 大身体
  const bodyGrad = ctx.createLinearGradient(0, -85, 0, 75);
  if(b.flash > 0){
    bodyGrad.addColorStop(0, '#ffffff');
    bodyGrad.addColorStop(1, '#f4eaff');
  }else{
    bodyGrad.addColorStop(0, '#7a58a9');
    bodyGrad.addColorStop(.6, '#5b3e83');
    bodyGrad.addColorStop(1, '#402b61');
  }
  ctx.fillStyle = bodyGrad;
  ctx.strokeStyle = '#2f1e47';
  ctx.lineWidth = 3.2;
  ctx.beginPath();
  ctx.ellipse(0, 0, 84, 73, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  // 肚子上的星纹
  ctx.save();
  ctx.globalAlpha = .22;
  ctx.fillStyle = '#ffd765';
  starPath(0, 18, 32, 14, 5, -.2);
  ctx.fill();
  ctx.restore();

  // 角
  ctx.fillStyle = '#36244e';
  ctx.beginPath();
  ctx.moveTo(-58, -59);
  ctx.quadraticCurveTo(-82, -101, -45, -91);
  ctx.quadraticCurveTo(-42, -75, -31, -73);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(58, -59);
  ctx.quadraticCurveTo(82, -101, 45, -91);
  ctx.quadraticCurveTo(42, -75, 31, -73);
  ctx.closePath();
  ctx.fill();

  // 王冠
  ctx.fillStyle = '#ffcf4e';
  ctx.strokeStyle = '#7b4c22';
  ctx.lineWidth = 2.4;
  ctx.beginPath();
  ctx.moveTo(-38, -72);
  ctx.lineTo(-29, -99);
  ctx.lineTo(-10, -83);
  ctx.lineTo(0, -108);
  ctx.lineTo(11, -83);
  ctx.lineTo(31, -99);
  ctx.lineTo(39, -72);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = '#ff7a8d';
  ctx.beginPath();
  ctx.arc(0, -76, 4.5, 0, Math.PI * 2);
  ctx.fill();

  // 眉毛
  ctx.strokeStyle = '#2c1b40';
  ctx.lineWidth = 6;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-44, -39);
  ctx.lineTo(-17, -31);
  ctx.moveTo(44, -39);
  ctx.lineTo(17, -31);
  ctx.stroke();

  // 眼睛
  ctx.fillStyle = '#ffe47b';
  ctx.shadowColor = '#ffd65e';
  ctx.shadowBlur = 14;
  ctx.beginPath();
  ctx.ellipse(-26, -20, 14, 16, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(26, -20, 14, 16, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#342042';
  ctx.beginPath();
  ctx.ellipse(-23, -18, 5.5, 9, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(29, -18, 5.5, 9, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.9)';
  ctx.beginPath();
  ctx.arc(-25, -22, 2, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(27, -22, 2, 0, Math.PI * 2);
  ctx.fill();

  // 大嘴
  ctx.fillStyle = '#2b1739';
  ctx.beginPath();
  ctx.moveTo(-29, 20);
  ctx.quadraticCurveTo(0, 10, 29, 20);
  ctx.quadraticCurveTo(21, 46, 0, 49);
  ctx.quadraticCurveTo(-21, 46, -29, 20);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.moveTo(-20, 22);
  ctx.lineTo(-12, 34);
  ctx.lineTo(-5, 23);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(20, 22);
  ctx.lineTo(12, 34);
  ctx.lineTo(5, 23);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#e9798c';
  ctx.beginPath();
  ctx.ellipse(0, 38, 13, 7, 0, 0, Math.PI * 2);
  ctx.fill();

  // 蓄力预警
  if(b.chargeWindup > 0){
    ctx.save();
    ctx.globalAlpha = .5 + Math.sin(t * 28) * .25;
    ctx.strokeStyle = '#ff6b62';
    ctx.lineWidth = 7;
    ctx.beginPath();
    ctx.ellipse(0, 0, 96, 84, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
    drawText('!', 0, -125, 44, '#ff5f5f', 'center', 900, '#fff1d9', 6);
  }

  ctx.restore();
}

function drawItem(item){
  if(item.taken) return;
  if(item.x < game.cameraX - 60 || item.x > game.cameraX + W + 60) return;
  const bob = Math.sin(game.time * 2.6 + item.phase) * 4;
  const x = item.x;
  const y = item.y + bob;

  // 光晕
  ctx.save();
  if(item.type !== 'coin'){
    const glow = ctx.createRadialGradient(x, y, 2, x, y, 23);
    const gcol = item.type === 'star' ? '255,227,91' : item.type === 'health' ? '255,129,145' : '126,221,255';
    glow.addColorStop(0, `rgba(${gcol},.28)`);
    glow.addColorStop(1, `rgba(${gcol},0)`);
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(x, y, 24, 0, Math.PI * 2);
    ctx.fill();
  }

  if(item.type === 'coin'){
    const spin = Math.abs(Math.cos(game.time * 4 + item.spin));
    ctx.translate(x, y);
    ctx.scale(Math.max(.18, spin), 1);
    ctx.fillStyle = '#ffc83d';
    ctx.strokeStyle = '#c78519';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, 11, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#ffe98b';
    ctx.beginPath();
    ctx.arc(-3, -3, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(154,92,13,.7)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(0, 0, 6, 0, Math.PI * 2);
    ctx.stroke();
  }else if(item.type === 'star'){
    ctx.translate(x, y);
    ctx.rotate(Math.sin(game.time * 2 + item.phase) * .18);
    ctx.shadowColor = 'rgba(255,215,70,.8)';
    ctx.shadowBlur = 12;
    ctx.fillStyle = '#ffdf55';
    ctx.strokeStyle = '#c48b1b';
    ctx.lineWidth = 2;
    starPath(0, 0, 15, 7, 5, -Math.PI / 2);
    ctx.fill();
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#71501e';
    ctx.beginPath();
    ctx.arc(-4, -1, 1.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(4, -1, 1.5, 0, Math.PI * 2);
    ctx.fill();
  }else if(item.type === 'health'){
    ctx.translate(x, y);
    fillRoundRect(-13, -13, 26, 26, 7, '#fff8ec');
    strokeRoundRect(-13, -13, 26, 26, 7, '#e8b4bd', 2);
    ctx.fillStyle = '#ff7184';
    heartPath(0, 0, 10);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.7)';
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(-5, -7);
    ctx.lineTo(-5, 2);
    ctx.moveTo(-9, -2.5);
    ctx.lineTo(-1, -2.5);
    ctx.stroke();
  }else if(item.type === 'shield'){
    ctx.translate(x, y);
    const pulse = 1 + Math.sin(game.time * 4) * .05;
    ctx.scale(pulse, pulse);
    ctx.fillStyle = '#d7f5ff';
    ctx.strokeStyle = '#4f9dc4';
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.moveTo(0, -16);
    ctx.lineTo(14, -9);
    ctx.lineTo(12, 7);
    ctx.quadraticCurveTo(7, 15, 0, 18);
    ctx.quadraticCurveTo(-7, 15, -12, 7);
    ctx.lineTo(-14, -9);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#69c9ee';
    starPath(0, 0, 7, 3, 5, game.time);
    ctx.fill();
  }
  ctx.restore();
}

function drawItems(){
  for(const item of game.items) drawItem(item);
}

function drawProjectiles(){
  for(const b of game.projectiles){
    if(b.x < game.cameraX - 80 || b.x > game.cameraX + W + 80) continue;
    if(b.kind === 'player'){
      // 拖尾
      for(let i = 0; i < b.trail.length; i++){
        const t = b.trail[i];
        const a = (i + 1) / b.trail.length;
        ctx.globalAlpha = a * .22;
        ctx.fillStyle = b.color;
        ctx.beginPath();
        ctx.arc(t.x, t.y, b.r * a * .8, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(b.rot);
      ctx.shadowColor = b.glow;
      ctx.shadowBlur = 12;
      ctx.fillStyle = b.color;
      starPath(0, 0, b.r + 2, b.r * .48, 5, 0);
      ctx.fill();
      ctx.fillStyle = '#fff9cf';
      ctx.beginPath();
      ctx.arc(0, 0, 3.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }else{
      for(let i = 0; i < b.trail.length; i++){
        const t = b.trail[i];
        const a = (i + 1) / b.trail.length;
        ctx.globalAlpha = a * .18;
        ctx.fillStyle = '#c699ff';
        ctx.beginPath();
        ctx.arc(t.x, t.y, b.r * a, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(b.rot);
      ctx.shadowColor = 'rgba(178,117,255,.8)';
      ctx.shadowBlur = 14;
      ctx.fillStyle = '#8e66cc';
      ctx.beginPath();
      ctx.arc(0, 0, b.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#d8baff';
      starPath(0, 0, b.r * .78, b.r * .34, 5, 0);
      ctx.fill();
      ctx.fillStyle = '#fff3ff';
      ctx.beginPath();
      ctx.arc(0, 0, 2.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }
  ctx.globalAlpha = 1;
}

function drawParticles(){
  for(const p of game.particles){
    if(p.screen) continue;
    const a = clamp(p.life / p.maxLife, 0, 1);
    ctx.globalAlpha = a;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.fillStyle = p.color;
    if(p.shape === 'star'){
      starPath(0, 0, p.size, p.size * .45, 5, 0);
      ctx.fill();
    }else{
      ctx.beginPath();
      ctx.arc(0, 0, p.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

function drawFloats(){
  for(const f of game.floats){
    const a = clamp(f.life / f.maxLife, 0, 1);
    ctx.save();
    ctx.globalAlpha = a;
    drawText(f.text, f.x, f.y, f.size, f.color, 'center', 900, 'rgba(55,36,29,.65)', 4);
    ctx.restore();
  }
}

function drawScreenFx(){
  for(const p of game.screenFx){
    const a = clamp(p.life / 2, 0, 1);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.fillStyle = p.color;
    if(p.shape === 'star'){
      starPath(0, 0, p.w, p.w * .45, 5, 0);
      ctx.fill();
    }else{
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
    }
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

function drawHeart(cx, cy, size, fill = true, fraction = 1){
  if(fill){
    ctx.save();
    ctx.beginPath();
    ctx.rect(cx - size, cy - size, size * 2 * fraction, size * 2);
    ctx.clip();
    heartPath(cx, cy, size);
    ctx.fillStyle = fraction > 0 ? '#f05d6f' : '#e6d9d4';
    ctx.fill();
    ctx.strokeStyle = '#a93d4e';
    ctx.lineWidth = 1.8;
    ctx.stroke();
    ctx.restore();
  }else{
    heartPath(cx, cy, size);
    ctx.fillStyle = 'rgba(194,174,166,.35)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(150,124,115,.45)';
    ctx.lineWidth = 1.7;
    ctx.stroke();
  }
}

function drawCoinIcon(cx, cy, r, alpha = 1){
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = '#ffc93f';
  ctx.strokeStyle = '#bd7c16';
  ctx.lineWidth = 1.8;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = '#ffe887';
  ctx.beginPath();
  ctx.arc(cx - r * .3, cy - r * .3, r * .32, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = 'rgba(154,92,13,.6)';
  ctx.lineWidth = 1.3;
  ctx.beginPath();
  ctx.arc(cx, cy, r * .55, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();
}

function drawPlayerPanel(p, x, y, side){
  const w = 316;
  const h = 92;
  ctx.save();
  ctx.shadowColor = 'rgba(45,32,28,.17)';
  ctx.shadowBlur = 14;
  ctx.shadowOffsetY = 5;
  fillRoundRect(x, y, w, h, 18, 'rgba(255,250,240,.93)');
  ctx.shadowColor = 'transparent';
  strokeRoundRect(x + 1.5, y + 1.5, w - 3, h - 3, 16, 'rgba(255,255,255,.9)', 2.5);
  strokeRoundRect(x + .5, y + .5, w - 1, h - 1, 18, p.id === 1 ? 'rgba(255,174,195,.65)' : 'rgba(231,178,118,.7)', 2);

  // 角色牌头
  const avatarX = side === 1 ? x + 49 : x + w - 49;
  ctx.save();
  ctx.globalAlpha = p.dead ? .55 : 1;
  drawPortrait(p, avatarX, y + 43, 31);
  if(p.dead){
    ctx.strokeStyle = 'rgba(111,63,63,.8)';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(avatarX - 22, y + 21);
    ctx.lineTo(avatarX + 22, y + 65);
    ctx.moveTo(avatarX + 22, y + 21);
    ctx.lineTo(avatarX - 22, y + 65);
    ctx.stroke();
  }
  ctx.restore();

  // 名字与 P 标签
  const textX = side === 1 ? x + 91 : x + w - 91;
  const align = side === 1 ? 'left' : 'right';
  drawText(p.name, textX, y + 22, 19, p.id === 1 ? '#58363e' : '#61412e', align, 900);
  const tagX = side === 1 ? textX + 48 : textX - 48;
  fillRoundRect(side === 1 ? tagX : tagX - 28, y + 12, 28, 18, 6, p.id === 1 ? '#ffe0e7' : '#ffead0');
  drawText(p.id === 1 ? 'P1' : 'P2', side === 1 ? tagX + 14 : tagX - 14, y + 21.5, 10, p.id === 1 ? '#d26b83' : '#bf7b36', 'center', 900);

  // 血量爱心
  const hp = p.hp;
  const heartSize = 8.2;
  const heartGap = 23;
  const heartsX = side === 1 ? x + 98 : x + w - 98 - heartGap * 4;
  for(let i = 0; i < 5; i++){
    const frac = clamp((hp - i * 20) / 20, 0, 1);
    const hx = heartsX + i * heartGap;
    drawHeart(hx, y + 47, heartSize, false);
    if(frac > 0) drawHeart(hx, y + 47, heartSize, true, frac);
  }

  // 血量数字
  drawText(`${Math.ceil(hp)} / ${p.maxHp}`, side === 1 ? x + 214 : x + w - 214, y + 68, 11, 'rgba(73,53,47,.72)', side === 1 ? 'left' : 'right', 700);

  // 金币
  const coinX = side === 1 ? x + 98 : x + w - 98;
  drawCoinIcon(side === 1 ? coinX : coinX, y + 68, 8);
  drawText(`× ${p.coins}`, side === 1 ? coinX + 15 : coinX - 15, y + 68, 14, '#6d4b2f', side === 1 ? 'left' : 'right', 800);

  // 护盾计时（放在爱心的另一侧，避开底部血量与金币）
  if(p.shieldTimer > 0){
    const sx = side === 1 ? x + w - 88 : x + 12;
    ctx.save();
    ctx.globalAlpha = .92;
    fillRoundRect(sx, y + 34, 76, 20, 9, 'rgba(208,245,255,.88)');
    strokeRoundRect(sx + .5, y + 34.5, 75, 19, 9, 'rgba(109,185,216,.55)', 1);
    drawText(`护盾 ${Math.ceil(p.shieldTimer)}s`, sx + 38, y + 44, 10.5, '#3e8fae', 'center', 800);
    ctx.restore();
  }

  ctx.restore();
}

function drawCenterHud(){
  const w = 404;
  const x = (W - w) / 2;
  const y = 14;
  const h = 58;
  const killed = game.enemies.filter(e => !e.alive).length;
  const total = game.enemies.length;
  const alive = game.enemies.filter(e => e.alive).length;

  ctx.save();
  ctx.shadowColor = 'rgba(41,30,28,.15)';
  ctx.shadowBlur = 12;
  ctx.shadowOffsetY = 4;
  fillRoundRect(x, y, w, h, 16, 'rgba(255,250,240,.91)');
  ctx.shadowColor = 'transparent';
  strokeRoundRect(x + 1, y + 1, w - 2, h - 2, 15, 'rgba(255,255,255,.9)', 2);
  strokeRoundRect(x + .5, y + .5, w - 1, h - 1, 16, 'rgba(236,193,115,.55)', 2);

  // 敌人图标
  drawMiniEnemy(x + 24, y + 20, 9);
  drawText('剩余敌人', x + 39, y + 20, 12, '#79564a', 'left', 700);
  drawText(String(alive).padStart(2, '0'), x + 100, y + 20, 19, alive ? '#c95758' : '#5aa45a', 'left', 900);

  const progress = game.bossActive || game.bossDefeated
    ? 1
    : clamp(Math.max(game.players[0].cx, game.players[1].cx) / BOSS_TRIGGER, 0, 1);

  drawText(game.bossActive || game.bossDefeated ? 'BOSS 区域' : `关卡进度 ${Math.round(progress * 100)}%`, x + w - 18, y + 20, 12, '#79564a', 'right', 800);

  // 进度条
  const barX = x + 19;
  const barY = y + 34;
  const barW = w - 38;
  fillRoundRect(barX, barY, barW, 12, 6, 'rgba(119,90,77,.16)');
  if(progress > 0){
    ctx.save();
    roundRectPath(barX + 2, barY + 2, Math.max(0, (barW - 4) * progress), 8, 4);
    ctx.clip();
    if(game.bossActive || game.bossDefeated){
      const g = ctx.createLinearGradient(barX, 0, barX + barW, 0);
      g.addColorStop(0, '#a27bea');
      g.addColorStop(1, '#ff8e87');
      ctx.fillStyle = g;
      ctx.fillRect(barX + 2, barY + 2, barW - 4, 8);
    }else{
      ctx.fillStyle = '#f3b942';
      ctx.fillRect(barX + 2, barY + 2, barW - 4, 8);
    }
    ctx.restore();
  }
  // 终点小旗（矢量绘制，避免不同系统字体缺少符号）
  const fx = barX + barW + 2;
  ctx.save();
  ctx.strokeStyle = '#b35c4c';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(fx, barY + 11);
  ctx.lineTo(fx, barY - 6);
  ctx.stroke();
  ctx.fillStyle = '#e27864';
  ctx.beginPath();
  ctx.moveTo(fx, barY - 6);
  ctx.lineTo(fx + 9, barY - 2);
  ctx.lineTo(fx, barY + 2);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  // 击败计数
  if(killed > 0){
    drawText(`已击败 ${killed}/${total}`, x + w - 18, y + 48, 9.5, 'rgba(102,77,67,.58)', 'right', 700);
  }
  ctx.restore();
}

function drawMiniEnemy(x, y, r){
  ctx.save();
  ctx.fillStyle = '#9b6ec9';
  ctx.strokeStyle = '#4a2d62';
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.ellipse(x, y, r, r * .9, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(x - 3, y - 1, 2, 0, Math.PI * 2);
  ctx.arc(x + 3, y - 1, 2, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#3d2450';
  ctx.beginPath();
  ctx.arc(x - 3, y - 1, .9, 0, Math.PI * 2);
  ctx.arc(x + 3, y - 1, .9, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawBossBar(){
  const b = game.boss;
  if(!b || !b.active) return;
  const w = 536;
  const x = (W - w) / 2;
  const y = 80;
  const h = 31;
  const hpPct = clamp(b.hp / b.maxHp, 0, 1);

  ctx.save();
  ctx.shadowColor = 'rgba(35,22,45,.3)';
  ctx.shadowBlur = 14;
  ctx.shadowOffsetY = 4;
  fillRoundRect(x - 8, y - 5, w + 16, h + 10, 15, 'rgba(43,27,57,.84)');
  ctx.shadowColor = 'transparent';
  strokeRoundRect(x - 8, y - 5, w + 16, h + 10, 15, 'rgba(226,204,255,.40)', 1.5);

  // 血条底
  fillRoundRect(x, y, w, h - 6, 9, 'rgba(25,18,38,.72)');
  const barW = (w - 4) * hpPct;
  if(barW > 0){
    ctx.save();
    roundRectPath(x + 2, y + 2, Math.max(0, barW), h - 10, 7);
    ctx.clip();
    const g = ctx.createLinearGradient(x, 0, x + w, 0);
    g.addColorStop(0, '#7d4ec4');
    g.addColorStop(.45, '#d15a95');
    g.addColorStop(1, '#ff806e');
    ctx.fillStyle = g;
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = 'rgba(255,255,255,.25)';
    ctx.fillRect(x + 2, y + 2, w, 4);
    ctx.restore();
  }

  // 名字
  drawText('暗影团子', x + 14, y + 13, 13, '#fff4d1', 'left', 900, 'rgba(38,22,48,.8)', 3);
  drawText(`${Math.ceil(b.hp)} / ${b.maxHp}`, x + w - 14, y + 13, 11, 'rgba(255,244,222,.9)', 'right', 800);

  // 小皇冠
  ctx.fillStyle = '#ffd45e';
  ctx.beginPath();
  ctx.moveTo(x + 2, y - 2);
  ctx.lineTo(x + 6, y - 13);
  ctx.lineTo(x + 12, y - 7);
  ctx.lineTo(x + 17, y - 16);
  ctx.lineTo(x + 23, y - 7);
  ctx.lineTo(x + 29, y - 13);
  ctx.lineTo(x + 33, y - 2);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawKeycap(label, x, y, w, h, accent = false){
  const fill = accent ? '#ffe2aa' : '#fffdf5';
  const border = accent ? '#d58d34' : '#cdb9a7';
  const color = accent ? '#7e4d1d' : '#54443b';
  ctx.save();
  ctx.shadowColor = 'rgba(82,59,42,.16)';
  ctx.shadowBlur = 4;
  ctx.shadowOffsetY = 2;
  fillRoundRect(x, y, w, h, 6, fill);
  ctx.shadowColor = 'transparent';
  strokeRoundRect(x + .5, y + .5, w - 1, h - 1, 6, border, 1.5);
  drawText(label, x + w / 2, y + h / 2 + .5, label.length > 2 ? 9 : 12, color, 'center', 900);
  ctx.restore();
}

  bg.addColorStop(0, hover ? '#ffd977' : '#ffcb5c');
  bg.addColorStop(1, hover ? '#ff9f76' : '#ffab55');
  fillRoundRect(-btn.w / 2, -btn.h / 2, btn.w, btn.h, 20, bg);
  ctx.shadowColor = 'transparent';
  strokeRoundRect(-btn.w / 2 + 1.5, -btn.h / 2 + 1.5, btn.w - 3, btn.h - 3, 19, 'rgba(255,255,255,.65)', 2);
  drawText('按  空格  开始冒险', 0, -1, 23, '#5e351a', 'center', 900);
  ctx.restore();

  ctx.restore();
}

function drawPause(){
  ctx.save();
  ctx.fillStyle = 'rgba(24,20,32,.46)';
  ctx.fillRect(0, 0, W, H);
  const x = W / 2 - 220, y = H / 2 - 128, w = 440, h = 256;
  ctx.shadowColor = 'rgba(0,0,0,.3)';
  ctx.shadowBlur = 30;
  fillRoundRect(x, y, w, h, 27, 'rgba(255,249,237,.96)');
  ctx.shadowColor = 'transparent';
  strokeRoundRect(x + 2, y + 2, w - 4, h - 4, 25, '#fff', 3);
  strokeRoundRect(x + .5, y + .5, w - 1, h - 1, 27, 'rgba(219,172,112,.7)', 2);

  drawText('暂停中', W / 2, y + 62, 38, '#694b3e', 'center', 900);
  drawText('休息一下，星星不会跑掉。', W / 2, y + 104, 14, 'rgba(94,73,65,.68)', 'center', 650);
  drawKeycap('P', W / 2 - 68, y + 134, 42, 36, true);
  drawText('或', W / 2 - 6, y + 152, 12, '#8c7569', 'center', 600);
  drawKeycap('Esc', W / 2 + 20, y + 134, 56, 36, true);
  drawText('继续游戏', W / 2, y + 198, 13, '#7e5d4e', 'center', 800);
  ctx.restore();
}

function drawResultButton(hover, label){
  const btn = RESTART_BUTTON;
  ctx.save();
  ctx.shadowColor = 'rgba(184,98,39,.34)';
  ctx.shadowBlur = hover ? 24 : 14;
  ctx.shadowOffsetY = 5;
  const bg = ctx.createLinearGradient(0, btn.y, 0, btn.y + btn.h);
  bg.addColorStop(0, hover ? '#ffd978' : '#ffcc5d');
  bg.addColorStop(1, hover ? '#ff9c73' : '#ffad58');
  fillRoundRect(btn.x, btn.y, btn.w, btn.h, 19, bg);
  ctx.shadowColor = 'transparent';
  strokeRoundRect(btn.x + 1.5, btn.y + 1.5, btn.w - 3, btn.h - 3, 18, 'rgba(255,255,255,.62)', 2);
  drawText(label, btn.x + btn.w / 2, btn.y + btn.h / 2 + 1, 22, '#5e351a', 'center', 900);
  ctx.restore();
}

function drawResult(){
  const r = game.result || makeResult('defeat');
  const victory = game.state === 'victory';
  const t = game.stateTime;
  const enter = easeOutBack(clamp(t * 1.8, 0, 1));

  ctx.save();
  ctx.fillStyle = victory ? 'rgba(24,33,48,.48)' : 'rgba(39,23,30,.54)';
  ctx.fillRect(0, 0, W, H);
  drawScreenFx();

  const pw = 656, ph = 500;
  const px = (W - pw) / 2;
  const py = 112 + (1 - enter) * 25;
  ctx.save();
  ctx.globalAlpha = clamp(t * 3, 0, 1);
  ctx.translate(0, (1 - enter) * 18);
  ctx.shadowColor = 'rgba(22,13,20,.36)';
  ctx.shadowBlur = 40;
  fillRoundRect(px, py, pw, ph, 30, victory ? 'rgba(255,251,236,.97)' : 'rgba(255,247,241,.97)');
  ctx.shadowColor = 'transparent';
  strokeRoundRect(px + 2, py + 2, pw - 4, ph - 4, 28, '#fff', 3);
  strokeRoundRect(px + .5, py + .5, pw - 1, ph - 1, 30, victory ? 'rgba(212,168,70,.7)' : 'rgba(203,139,131,.65)', 2);

  // 顶部装饰
  ctx.save();
  ctx.translate(W / 2, py + 54);
  ctx.rotate(victory ? Math.sin(game.time * 2) * .05 : 0);
  ctx.fillStyle = victory ? '#ffcf4e' : '#e68b86';
  ctx.strokeStyle = victory ? '#9b641c' : '#944f4b';
  ctx.lineWidth = 2.4;
  starPath(0, 0, 30, 13, 5, 0);
  ctx.fill();
  ctx.stroke();
  ctx.restore();

  drawText(victory ? '星光胜利！' : '冒险结束', W / 2, py + 108, 42, victory ? '#a3681e' : '#8e4d51', 'center', 900);
  drawText(
    victory ? '暗影团子被星光净化，森林重新亮了起来！' : '两位伙伴必须一起抵达终点，再试一次吧！',
    W / 2, py + 144, 13, victory ? '#806445' : '#7e6560', 'center', 700
  );

  if(!victory && r.victim){
    drawText(`${r.victim.name}倒下了……`, W / 2, py + 163, 12, '#ad6a6a', 'center', 700);
  }

  // 两位玩家统计卡
  const statY = py + 184;
  drawResultPlayerCard(game.players[0], px + 36, statY, 280, 148, 1);
  drawResultPlayerCard(game.players[1], px + pw - 36 - 280, statY, 280, 148, 2);

  // 汇总
  ctx.save();
  fillRoundRect(px + 36, py + 346, pw - 72, 51, 12, 'rgba(244,226,195,.50)');
  const colW = (pw - 72) / 3;
  drawResultStat(px + 36 + colW * .5, py + 362, '冒险用时', formatTime(r.time));
  drawResultStat(px + 36 + colW * 1.5, py + 362, '剩余敌人', String(r.enemiesLeft));
  drawResultStat(px + 36 + colW * 2.5, py + 362, '总金币', String(r.p1Coins + r.p2Coins));
  ctx.restore();

  drawResultButton(game.uiHover === 'restart', '再来一局');
  drawText('按  R / 空格  也可以重新开始', W / 2, py + ph - 14, 10.5, 'rgba(98,77,67,.55)', 'center', 650);
  ctx.restore();
  ctx.restore();
}

function drawResultPlayerCard(p, x, y, w, h, id){
  ctx.save();
  fillRoundRect(x, y, w, h, 16, id === 1 ? 'rgba(255,238,243,.76)' : 'rgba(255,241,219,.82)');
  strokeRoundRect(x + .5, y + .5, w - 1, h - 1, 16, id === 1 ? 'rgba(233,177,189,.55)' : 'rgba(218,174,123,.55)', 1.5);
  drawPortrait(p, x + 40, y + 45, 27);
  drawText(p.name, x + 78, y + 30, 18, id === 1 ? '#5d3a42' : '#5f3e2a', 'left', 900);
  drawText(id === 1 ? 'P1' : 'P2', x + 78, y + 53, 10, 'rgba(109,79,68,.55)', 'left', 700);

  drawText('金币', x + 18, y + 88, 11, 'rgba(107,78,63,.67)', 'left', 650);
  drawText(String(p.coins), x + w - 18, y + 88, 16, '#8e5e2b', 'right', 900);
  drawText('星星', x + 18, y + 111, 11, 'rgba(107,78,63,.67)', 'left', 650);
  drawText(String(p.stars), x + w - 18, y + 111, 16, '#c18a28', 'right', 900);
  drawText('得分', x + 18, y + 133, 11, 'rgba(107,78,63,.67)', 'left', 650);
  drawText(String(p.score), x + w - 18, y + 133, 16, '#6d5849', 'right', 900);
  ctx.restore();
}

function drawResultStat(cx, y, label, value){
  drawText(label, cx, y, 10, 'rgba(107,85,71,.62)', 'center', 650);
  drawText(value, cx, y + 17, 16, '#654c3d', 'center', 900);
}

function drawBanners(){
  if(game.state !== 'playing') return;

  if(game.startBanner > 0){
    const p = game.startBanner / 2;
    const a = p > .82 ? (1 - p) / .18 : Math.min(1, p / .22);
    ctx.save();
    ctx.globalAlpha = clamp(a, 0, 1);
    const s = easeOutBack(clamp((1 - p) * 3, 0, 1));
    ctx.translate(W / 2, 208);
    ctx.scale(s, s);
    ctx.shadowColor = 'rgba(146,85,33,.25)';
    ctx.shadowBlur = 18;
    fillRoundRect(-164, -36, 328, 72, 22, 'rgba(255,249,234,.94)');
    ctx.shadowColor = 'transparent';
    strokeRoundRect(-163, -35, 326, 70, 21, 'rgba(255,255,255,.9)', 2.5);
    drawText('出发！', 0, 2, 38, '#9b642c', 'center', 900);
    ctx.restore();
  }

  if(game.bossBanner > 0 && game.boss.active && !game.boss.dead){
    const p = game.bossBanner / 2.7;
    const a = p > .85 ? (1 - p) / .15 : Math.min(1, p / .18);
    ctx.save();
    ctx.globalAlpha = clamp(a, 0, 1);
    ctx.translate(W / 2, 220);
    ctx.shadowColor = 'rgba(62,28,79,.5)';
    ctx.shadowBlur = 22;
    const g = ctx.createLinearGradient(-260, 0, 260, 0);
    g.addColorStop(0, 'rgba(70,42,101,.92)');
    g.addColorStop(.5, 'rgba(111,65,151,.94)');
    g.addColorStop(1, 'rgba(70,42,101,.92)');
    fillRoundRect(-300, -56, 600, 112, 25, g);
    ctx.shadowColor = 'transparent';
    strokeRoundRect(-298, -54, 596, 108, 24, 'rgba(231,207,255,.58)', 2);
    drawText('BOSS', 0, -27, 13, '#e1c7ff', 'center', 900);
    drawText('暗影团子', 0, 7, 36, '#ffe7a3', 'center', 900, 'rgba(42,23,55,.8)', 5);
    drawText('一起用星光弹攻击它！', 0, 36, 12, 'rgba(242,226,255,.86)', 'center', 650);
    ctx.restore();
  }
}

function drawHitFlash(){
  if(game.hitFlash > 0){
    ctx.save();
    ctx.globalAlpha = Math.min(.34, game.hitFlash);
    ctx.fillStyle = game.bossDefeated ? '#fff9d7' : '#ff5f6b';
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }
}

/* ------------------------------------------------------------------
   13. 主渲染
------------------------------------------------------------------ */
function renderWorld(){
  const shakeX = game.shake > 0 ? (Math.random() * 2 - 1) * game.shake : 0;
  const shakeY = game.shake > 0 ? (Math.random() * 2 - 1) * game.shake * .7 : 0;

  drawSky();
  drawClouds();
  drawMountains();
  drawAbyss();

  ctx.save();
  ctx.translate(-Math.round(game.cameraX) + shakeX, shakeY);

  drawDecor();
  drawGrounds();
  drawBossArenaDecor();
  drawSign(320, GROUND_Y, '起点', '#d99550');
  drawPlatforms();
  drawSprings();
  drawHiddenBlocks();
  drawBossWall();
  drawItems();
  drawEnemies();
  drawBoss();
  drawCoopBond();
  drawPlayers();
  drawProjectiles();
  drawParticles();
  drawFloats();

  ctx.restore();

  drawHitFlash();
  drawHud();
  drawBanners();
}

function render(){
  if(!game) return;
  ctx.clearRect(0, 0, W, H);

  if(game.state === 'title'){
    drawTitle();
    return;
  }

  renderWorld();

  if(game.state === 'paused') drawPause();
  if(game.state === 'gameover' || game.state === 'victory') drawResult();
}

/* ------------------------------------------------------------------
   14. 输入
------------------------------------------------------------------ */
function activeButton(){
  if(!game) return null;
  if(game.state === 'title') return 'start';
  if(game.state === 'gameover' || game.state === 'victory') return 'restart';
  return null;
}

function buttonRectFor(name){
  return name === 'start' ? START_BUTTON : RESTART_BUTTON;
}

function pointInRect(x, y, r){
  return x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;
}

function toCanvasPoint(e){
  const r = canvas.getBoundingClientRect();
  return {
    x:(e.clientX - r.left) * (W / r.width),
    y:(e.clientY - r.top) * (H / r.height)
  };
}

function updateCursor(){
  if(!game){ canvas.style.cursor = 'default'; return; }
  const name = activeButton();
  const hover = name && pointInRect(pointer.x, pointer.y, buttonRectFor(name));
  game.uiHover = hover ? name : null;
  canvas.style.cursor = hover ? 'pointer' : 'default';
}

function handleKeyDown(e){
  const code = e.code;
  const gameKeys = [
    'Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyW','KeyA','KeyS','KeyD',
    'KeyE','Enter','KeyP','Escape','KeyM','KeyR'
  ];
  if(gameKeys.includes(code)) e.preventDefault();

  if(e.repeat) return;
  if(!game) return;

  if(code === 'KeyM'){
    muted = !muted;
    if(!muted) initAudio();
    return;
  }

  if(game.state === 'title'){
    if(code === 'Space' || code === 'Enter'){
      beginGame();
    }
    return;
  }

  if(game.state === 'gameover' || game.state === 'victory'){
    if(code === 'Space' || code === 'Enter' || code === 'KeyR'){
      beginGame();
    }
    return;
  }

  if(game.state === 'paused'){
    if(code === 'KeyP' || code === 'Escape' || code === 'Space'){
      setGameState('playing');
    }
    return;
  }

  if(game.state === 'playing'){
    if(code === 'KeyP' || code === 'Escape'){
      setGameState('paused');
      return;
    }
    keys.add(code);
    if(code === 'KeyW'){
      game.players[0].jumpBuffer = .13;
      game.players[0].jumpCut = false;
    }
    if(code === 'ArrowUp'){
      game.players[1].jumpBuffer = .13;
      game.players[1].jumpCut = false;
    }
  }
}

function handleKeyUp(e){
  const code = e.code;
  keys.delete(code);

  if(!game) return;
  if(game.state === 'playing'){
    if(code === 'KeyW'){
      const p = game.players[0];
      if(p.vy < -190 && !p.jumpCut){ p.vy *= .53; p.jumpCut = true; }
    }
    if(code === 'ArrowUp'){
      const p = game.players[1];
      if(p.vy < -190 && !p.jumpCut){ p.vy *= .53; p.jumpCut = true; }
    }
  }
}

function handlePointerMove(e){
  const p = toCanvasPoint(e);
  pointer.x = p.x;
  pointer.y = p.y;
  pointer.down = false;
  updateCursor();
}

function handlePointerDown(e){
  const p = toCanvasPoint(e);
  pointer.x = p.x;
  pointer.y = p.y;

  if(!game) return;
  initAudio();

  if(game.state === 'title' && pointInRect(p.x, p.y, START_BUTTON)){
    beginGame();
    return;
  }
  if((game.state === 'gameover' || game.state === 'victory') && pointInRect(p.x, p.y, RESTART_BUTTON)){
    beginGame();
    return;
  }
  updateCursor();
}

function handlePointerLeave(){
  pointer.x = -999;
  pointer.y = -999;
  if(game) game.uiHover = null;
  updateCursor();
}

window.addEventListener('keydown', handleKeyDown, {passive:false});
window.addEventListener('keyup', handleKeyUp, {passive:false});
window.addEventListener('blur', () => {
  keys.clear();
  if(game && game.state === 'playing') setGameState('paused');
});
canvas.addEventListener('pointermove', handlePointerMove);
canvas.addEventListener('pointerdown', handlePointerDown);
canvas.addEventListener('pointerleave', handlePointerLeave);
window.addEventListener('contextmenu', e => e.preventDefault());

/* ------------------------------------------------------------------
   15. 游戏主循环
------------------------------------------------------------------ */
function frame(timestamp){
  if(!lastTimestamp) lastTimestamp = timestamp;
  let delta = (timestamp - lastTimestamp) / 1000;
  lastTimestamp = timestamp;
  if(delta > .1) delta = .1;
  accumulator += delta;

  let steps = 0;
  while(accumulator >= FIXED_DT && steps < 5){
    updateGame(FIXED_DT);
    accumulator -= FIXED_DT;
    steps++;
  }
  if(steps === 5) accumulator = 0;

  render();
  updateCursor();
  requestAnimationFrame(frame);
}

/* ------------------------------------------------------------------
   16. 启动
------------------------------------------------------------------ */
game = createGame();
game.state = 'title';
game.stateTime = 0;
game.cameraX = 70;
game.cameraTarget = 70;

// 让画布可获得键盘焦点（键盘监听在 window 上，双保险）
canvas.setAttribute('tabindex', '0');
try{
  canvas.focus({preventScroll:true});
}catch(e){
  canvas.focus();
}

requestAnimationFrame(frame);

})();
</script>

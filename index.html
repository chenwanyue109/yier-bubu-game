    isolation:isolate;
  }
  #stage::after{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;

    box-shadow:inset 0 0 0 1px rgba(44,31,28,.18);

    display:block;
    width:100%;
    height:100%;
    touch-action:none;

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

const sign = v => v < 0 ? -1 : v > 0 ? 1 : 0;
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
const easeOutBack = t => {
  const c1 = 1.70158, c3 = c1 + 1;
  return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
};

function aabb(a, b){
  return a.x < b.x + b.w && a.x + a.w > b.x &&
         a.y < b.y + b.h && a.y + a.h > b.y;
}

function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a |= 0;
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function makeRng(seed){
  const r = mulberry32(seed);
  return {
    next:r,
    range:(a,b) => a + (b - a) * r(),
    int:(a,b) => Math.floor(a + (b - a + 1) * r()),
    pick:arr => arr[Math.floor(r() * arr.length)]
  };
}

function shuffle(arr, rng){
  for(let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(rng.next() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function roundRectPath(x, y, w, h, r){
  const rr = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.arcTo(x + w, y, x + w, y + h, rr);
  ctx.arcTo(x + w, y + h, x, y + h, rr);
  ctx.arcTo(x, y + h, x, y, rr);
  ctx.arcTo(x, y, x + w, y, rr);
  ctx.closePath();
}

function fillRoundRect(x, y, w, h, r, color){
  roundRectPath(x, y, w, h, r);
  ctx.fillStyle = color;
  ctx.fill();
}

function strokeRoundRect(x, y, w, h, r, color, width = 1){
  roundRectPath(x, y, w, h, r);
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.stroke();
}

function starPath(cx, cy, outer, inner, points = 5, rotation = -Math.PI / 2){
  ctx.beginPath();
  for(let i = 0; i < points * 2; i++){
    const r = i % 2 === 0 ? outer : inner;
    const a = rotation + (Math.PI / points) * i;
    const x = cx + Math.cos(a) * r;
    const y = cy + Math.sin(a) * r;
    if(i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
}

function heartPath(cx, cy, size){
  const s = size;
  ctx.beginPath();
  ctx.moveTo(cx, cy + s * .42);
  ctx.bezierCurveTo(cx - s * .96, cy - s * .16, cx - s * .55, cy - s * .72, cx, cy - s * .28);
  ctx.bezierCurveTo(cx + s * .55, cy - s * .72, cx + s * .96, cy - s * .16, cx, cy + s * .42);
  ctx.closePath();
}

function drawText(text, x, y, size, color, align = 'center', weight = 700, stroke = null, strokeWidth = 0){
  ctx.save();
  ctx.font = `${weight} ${size}px ${FONT}`;
  ctx.textAlign = align;
  ctx.textBaseline = 'middle';
  if(stroke && strokeWidth > 0){
    ctx.lineJoin = 'round';
    ctx.strokeStyle = stroke;
    ctx.lineWidth = strokeWidth;
    ctx.strokeText(text, x, y);
  }
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
  ctx.restore();
}

function formatTime(seconds){
  const s = Math.max(0, Math.floor(seconds));
  const m = Math.floor(s / 60);
  const r = s % 60;
  return `${String(m).padStart(2, '0')}:${String(r).padStart(2, '0')}`;
}

/* ------------------------------------------------------------------
   2. 程序化音效（WebAudio，无外部资源）
------------------------------------------------------------------ */
function initAudio(){
  if(audioCtx) {
    if(audioCtx.state === 'suspended') audioCtx.resume();
    return;
  }
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    audioCtx = new AC();
  }catch(e){
    audioCtx = null;
  }
}

function tone(freq, dur, type = 'sine', volume = .04, slide = 0, delay = 0){
  if(!audioCtx || muted) return;
  try{
    const t0 = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(Math.max(30, freq), t0);
    if(slide){
      osc.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t0 + dur);
    }
    gain.gain.setValueAtTime(.0001, t0);
    gain.gain.exponentialRampToValueAtTime(Math.max(.0002, volume), t0 + .012);
    gain.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(t0);
    osc.stop(t0 + dur + .025);
  }catch(e){}
}

function chord(notes, dur = .12, type = 'triangle', volume = .035){
  notes.forEach((n, i) => tone(n, dur, type, volume, 0, i * .045));
}

const PLAYER_SPRITES = {};
if (typeof Image !== 'undefined') {
  for (const id of [1, 2]) {
    const img = new Image();
    const sprite = { img, ready: false, aspect: 1 };
    img.onload = function(){
      sprite.ready = true;
      sprite.aspect = img.naturalWidth / img.naturalHeight;
    };
    img.src = PLAYER_SPRITE_SOURCES[id];
    PLAYER_SPRITES[id] = sprite;
  }
}

class Player {
  constructor(id, startX){
    this.id = id;
    this.pal = PALETTES[id];
    this.name = this.pal.name;
    this.controls = id;
    this.w = 32;
    this.h = 54;
    this.startX = startX;
    this.startY = GROUND_Y - this.h;
    this.reset(true);
  }

  reset(full){
    this.x = this.startX;
    this.y = this.startY;
    this.vx = 0;
    this.vy = 0;
    this.facing = 1;
    this.onGround = false;
    this.groundRef = null;
    this.coyote = 0;
    this.jumpBuffer = 0;
    this.jumpCut = false;
    this.crouch = false;
    this.walkPhase = this.id * 1.7;
    this.invuln = 0;
    this.hurtTimer = 0;
    this.shieldTimer = 0;
    this.attackAnim = 0;
    this.fireCd = 0;
    this.dead = false;
    this.deathT = 0;
    this.lastSafe = {x:this.startX, y:this.startY};
    if(full){
      this.maxHp = 100;
      this.hp = 100;
      this.coins = 0;
      this.stars = 0;
      this.score = 0;
    }
  }

  get cx(){ return this.x + this.w / 2; }
  get cy(){ return this.y + this.h / 2; }
  get feet(){ return this.y + this.h; }

  update(dt){
    if(this.dead){
      this.deathT += dt;
      return;
    }

    this.invuln = Math.max(0, this.invuln - dt);
    this.hurtTimer = Math.max(0, this.hurtTimer - dt);
    this.shieldTimer = Math.max(0, this.shieldTimer - dt);
    this.attackAnim = Math.max(0, this.attackAnim - dt);
    this.fireCd = Math.max(0, this.fireCd - dt);
    this.jumpBuffer = Math.max(0, this.jumpBuffer - dt);

    const inp = this.controls === 1
      ? {left:keys.has('KeyA'), right:keys.has('KeyD'), down:keys.has('KeyS'), jump:keys.has('KeyW'), attack:keys.has('KeyE')}
      : {left:keys.has('ArrowLeft'), right:keys.has('ArrowRight'), down:keys.has('ArrowDown'), jump:keys.has('ArrowUp'), attack:keys.has('Enter')};

    this.crouch = inp.down && this.onGround;
    const dir = (inp.right ? 1 : 0) - (inp.left ? 1 : 0);
    if(dir !== 0) this.facing = dir;

    const targetSpeed = this.crouch ? 105 : RUN_SPEED;
    const want = dir * targetSpeed;
    let rate;
    if(dir !== 0){
      rate = (this.onGround ? ACCEL : AIR_ACCEL) * dt;
      this.vx += clamp(want - this.vx, -rate, rate);
    }else{
      rate = (this.onGround ? FRICTION : AIR_ACCEL * .35) * dt;
      if(this.vx > 0) this.vx = Math.max(0, this.vx - rate);
      else if(this.vx < 0) this.vx = Math.min(0, this.vx + rate);
    }

    if(this.onGround){
      this.coyote = .10;
    }else{
      this.coyote = Math.max(0, this.coyote - dt);
    }

    if(this.jumpBuffer > 0 && (this.onGround || this.coyote > 0)){
      this.jump();
    }

    if(inp.down && !this.onGround && this.vy > -90){
      this.vy += 1050 * dt;
    }

    // 跟随移动平台
    if(this.groundRef && this.groundRef.isMover && this.onGround){
      this.x += this.groundRef.dx || 0;
      this.y += this.groundRef.dy || 0;
    }

    // 水平移动与碰撞
    this.x += this.vx * dt;
    this.resolveHorizontal();

    // 重力与垂直碰撞
    this.vy = Math.min(MAX_FALL, this.vy + GRAVITY * dt);
    if(this.vy < 0) this.vy += 120 * dt;
    this.prevFeet = this.feet;
    this.y += this.vy * dt;
    this.resolveVertical();

    // 世界边界
    this.x = clamp(this.x, 0, WORLD_W - this.w - 20);
    if(game && game.boss && game.boss.active && !game.boss.dead){
      this.x = Math.max(this.x, BOSS_WALL + 22);
    }

    // 攻击（持续按住也会按冷却发射）
    if(inp.attack && this.fireCd <= 0){
      this.shoot();
    }

    // 安全落点记录
    if(this.onGround && this.groundRef && !this.groundRef.isMover && this.groundRef.kind !== 'hidden'){
      this.lastSafe.x = this.x;
      this.lastSafe.y = this.y;
    }

    // 行走动画相位
    if(this.onGround && Math.abs(this.vx) > 20){
      this.walkPhase += Math.abs(this.vx) * dt * .075;
    }else{
      this.walkPhase += dt * .8;
    }

  }

  resolveHorizontal(){
    const solids = getSolids();
    for(let i = 0; i < solids.length; i++){
      const s = solids[i];
      if(!aabb(this, s)) continue;
      if(this.vx > 0){
        this.x = s.x - this.w - .01;
      }else if(this.vx < 0){
        this.x = s.x + s.w + .01;
      }
      this.vx = 0;
    }
  }

  resolveVertical(){
    const wasOnGround = this.onGround;
    this.onGround = false;
    this.groundRef = null;
    const prevFeet = this.prevFeet === undefined ? this.feet : this.prevFeet;

    // 地面与隐藏砖块：双向实体碰撞
    const solids = getSolids();
    for(let i = 0; i < solids.length; i++){
      const s = solids[i];
      if(!aabb(this, s)) continue;
      if(this.vy > 0){
        const impact = this.vy;
        this.y = s.y - this.h - .01;
        this.vy = 0;
        this.onGround = true;
        this.groundRef = s;
        if(!wasOnGround && impact > 420) sfx.land();
      }else if(this.vy < 0){
        this.y = s.y + s.h + .01;
        this.vy = 0;
        if(s.kind === 'hidden' && !s.revealed){
          revealBlock(s);
        }
      }
    }

    // 草地浮台与移动平台：单向平台，可以从下方穿过，只在下落时落上去
    if(this.vy > 0){
      for(const s of game.oneWays){
        if(this.x + this.w <= s.x + 1 || this.x >= s.x + s.w - 1) continue;
        if(prevFeet <= s.y + 3 && this.feet >= s.y){
          const impact = this.vy;
          this.y = s.y - this.h - .01;
          this.vy = 0;
          this.onGround = true;
          this.groundRef = s;
          if(!wasOnGround && impact > 420) sfx.land();
        }
      }
    }
  }

  jump(){
    this.vy = -JUMP_VELOCITY;
    this.onGround = false;
    this.groundRef = null;
    this.coyote = 0;
    this.jumpBuffer = 0;
    this.jumpCut = false;
    this.crouch = false;
    sfx.jump();
    spawnRing(this.cx, this.feet - 2, 'rgba(255,255,255,.65)', 8);
  }

  shoot(){
    if(!game || game.state !== 'playing') return;
    this.fireCd = .31;
    this.attackAnim = .15;
    const py = this.crouch ? this.y + 34 : this.y + 23;
    const sx = this.cx + this.facing * 24;
    let vx = this.facing * 780;
    let vy = 0;

    // BOSS 战中轻微辅助瞄准，让站在高台上的玩家也能打到巨大的暗影团子
    const boss = game.boss;
    if(boss && boss.active && !boss.dead && sign(boss.cx - sx) === this.facing){
      const dx = Math.abs(boss.cx - sx);
      if(dx < 820){
        const targetY = boss.y + boss.h * .55;
        const angle = clamp(Math.atan2(targetY - py, dx), -.48, .48);
        vx = this.facing * Math.cos(angle) * 780;
        vy = Math.sin(angle) * 780;
      }
    }

    game.projectiles.push({
      kind:'player',
      ownerId:this.id,
      owner:this,
      x:sx,
      y:py,
      vx,
      vy,
      r:8,
      life:1.7,
      damage:20,
      color:this.pal.bullet,
      glow:this.pal.bulletGlow,
      rot:0,
      trail:[]
    });
    spawnBurst(this.cx + this.facing * 25, py, this.pal.bullet, 4, {size:3, spread:90, speed:70, gravity:30, life:.22});
    sfx.shoot();
  }

  takeDamage(amount, sourceX = null, force = false){
    if(this.dead) return false;
    if(!force && (this.invuln > 0 || this.shieldTimer > 0)){
      if(this.shieldTimer > 0 && !force){
        this.invuln = Math.max(this.invuln, .35);
        spawnBurst(this.cx, this.cy, '#7fdcff', 8, {size:3.5, speed:140, life:.35, gravity:30});
        game.shake = Math.max(game.shake, 2);
      }
      return false;
    }

    this.hp = Math.max(0, this.hp - amount);
    this.invuln = Math.max(this.invuln, 1.15);
    this.hurtTimer = .38;
    const dir = sourceX === null ? -this.facing : (sign(this.cx - sourceX) || 1);
    this.vx = dir * 295;
    this.vy = -330;
    this.onGround = false;
    this.groundRef = null;
    this.crouch = false;

    spawnBurst(this.cx, this.cy, '#ff6b7d', 12, {size:4, speed:210, life:.45, gravity:420});
    addFloatText(`-${amount}`, this.cx, this.y - 8, '#ff536b', 19);
    game.shake = Math.max(game.shake, 7);
    game.hitFlash = Math.max(game.hitFlash, .22);
    sfx.hurt();

    if(this.hp <= 0){
      this.die();
    }
    return true;
  }

  heal(amount){
    const before = this.hp;
    this.hp = Math.min(this.maxHp, this.hp + amount);
    return this.hp - before;
  }

  die(){
    if(this.dead) return;
    this.dead = true;
    this.deathT = 0;
    this.vx = 0;
    this.vy = -160;
    spawnBurst(this.cx, this.cy, this.pal.accent, 26, {size:5, speed:260, life:.9, gravity:310, star:true});
    beginGameOver(this);
  }
}

/* ------------------------------------------------------------------
   5. BOSS
------------------------------------------------------------------ */
class Boss {
  constructor(){
    this.w = 188;
    this.h = 148;
    this.x = 8500;
    this.y = GROUND_Y - this.h;
    this.maxHp = 1200;
    this.hp = this.maxHp;
    this.active = false;
    this.intro = 0;
    this.attackTimer = 2.2;
    this.chargeCd = 5.5;
    this.chargeWindup = 0;
    this.chargeTime = 0;
    this.chargeDir = -1;
    this.flash = 0;
    this.dead = false;
    this.deathTimer = 0;
    this.deathTick = 0;
    this.phase = 1;
    this.facing = -1;
    this.bobPhase = 0;
    this.wallOn = false;
  }

  get cx(){ return this.x + this.w / 2; }
  get cy(){ return this.y + this.h / 2; }

  activate(){
    this.active = true;
    this.wallOn = true;
    this.intro = 2.1;
    this.attackTimer = 2.4;
    this.chargeCd = 4.6;
    game.shake = Math.max(game.shake, 12);
    sfx.bossRoar();
    addFloatText('暗影团子 出现了！', this.cx, this.y - 34, '#fff4a5', 26);
    spawnBurst(this.cx, this.cy, '#a980ff', 34, {size:6, speed:300, life:1.1, gravity:220, star:true});
  }

  update(dt){
    this.flash = Math.max(0, this.flash - dt);
    this.bobPhase += dt;

    if(this.dead){
      this.deathTimer -= dt;
      this.deathTick -= dt;
      if(this.deathTick <= 0){
        this.deathTick = .11;
        spawnBurst(this.x + Math.random() * this.w, this.y + Math.random() * this.h, Math.random() < .5 ? '#ffd96b' : '#b78dff', 7, {
          size:5, speed:220, life:.8, gravity:180, star:true
        });
        game.shake = Math.max(game.shake, 4);
      }
      if(this.deathTimer <= 0){
        triggerVictory();
      }
      return;
    }

    if(!this.active) return;
    if(this.intro > 0){
      this.intro = Math.max(0, this.intro - dt);
      return;
    }

    this.phase = this.hp > this.maxHp * .55 ? 1 : (this.hp > this.maxHp * .25 ? 2 : 3);

    const alive = game.players.filter(p => !p.dead);
    if(!alive.length) return;
    let nearest = alive[0];
    let best = Infinity;
    for(const p of alive){
      const d = Math.abs(p.cx - this.cx);
      if(d < best){ best = d; nearest = p; }
    }

    this.facing = sign(nearest.cx - this.cx) || -1;

    if(this.chargeWindup > 0){
      this.chargeWindup -= dt;
      game.shake = Math.max(game.shake, 1.2);
      if(this.chargeWindup <= 0){
        this.chargeTime = .92;
        this.chargeDir = sign(nearest.cx - this.cx) || this.facing;
        this.facing = this.chargeDir;
        game.shake = Math.max(game.shake, 8);
        sfx.bossRoar();
        spawnBurst(this.cx, this.y + this.h, '#ffac58', 14, {size:4, speed:180, life:.45, gravity:280});
      }
      return;
    }

    if(this.chargeTime > 0){
      this.chargeTime -= dt;
      this.x += this.chargeDir * 610 * dt;
      this.x = clamp(this.x, 8040, 9080 - this.w);
      if(Math.random() < .7){
        spawnBurst(this.cx - this.chargeDir * 55, this.y + this.h - 5, '#d8b6ff', 2, {size:3, speed:80, life:.35, gravity:160});
      }
      if(this.x <= 8040 || this.x >= 9080 - this.w){
        this.chargeTime = 0;
        this.chargeCd = Math.max(2.8, 5.5 - this.phase * .65);
        game.shake = Math.max(game.shake, 12);
        spawnBurst(this.cx, this.y + this.h - 6, '#cda4ff', 18, {size:5, speed:250, life:.6, gravity:200});
      }
    }else{
      const speed = 72 + this.phase * 22;
      const dx = nearest.cx - this.cx;
      if(Math.abs(dx) > 170){
        this.x += sign(dx) * speed * dt;
      }else{
        // 靠近玩家时缓慢游走，让 BOSS 始终有来回移动的压迫感
        this.x += Math.sin(this.bobPhase * 1.35) * 54 * dt;
      }
      this.x = clamp(this.x, 8040, 9080 - this.w);

      this.attackTimer -= dt;
      this.chargeCd -= dt;

      if(this.attackTimer <= 0){
        if(this.phase >= 2 && this.chargeCd <= 0 && Math.random() < .48){
          this.chargeWindup = .78;
          this.chargeCd = 6.0;
          this.attackTimer = 2.1;
          addFloatText('小心冲撞！', this.cx, this.y - 18, '#ffd35c', 19);
        }else{
          this.fireFan();
          this.attackTimer = Math.max(.95, 1.85 - this.phase * .22) + Math.random() * .35;
        }
      }
    }

    // 身体碰撞
    for(const p of alive){
      if(this.overlapsPlayer(p)){
        const dmg = this.chargeTime > 0 ? 25 : 17;
        p.takeDamage(dmg, this.cx);
      }
    }
  }

  overlapsPlayer(p){
    return p.x < this.x + this.w - 10 && p.x + p.w > this.x + 10 &&
           p.y < this.y + this.h - 6 && p.y + p.h > this.y + 12;
  }

  fireFan(){
    const alive = game.players.filter(p => !p.dead);
    if(!alive.length) return;
    let target = alive[0], best = Infinity;
    for(const p of alive){
      const d = Math.abs(p.cx - this.cx) + Math.abs(p.cy - this.cy);
      if(d < best){ best = d; target = p; }
    }
    const base = Math.atan2(target.cy - (this.y + 60), target.cx - this.cx);
    const count = this.phase === 1 ? 3 : this.phase === 2 ? 4 : 5;
    const spread = this.phase === 1 ? .16 : .145;
    for(let i = 0; i < count; i++){
      const a = base + (i - (count - 1) / 2) * spread;
      const sp = 265 + this.phase * 22;
      game.projectiles.push({
        kind:'boss',
        x:this.cx + Math.cos(a) * 60,
        y:this.y + 60 + Math.sin(a) * 48,
        vx:Math.cos(a) * sp,
        vy:Math.sin(a) * sp,
        r:11,
        life:4.5,
        damage:12,
        rot:Math.random() * Math.PI,
        trail:[]
      });
    }
    spawnBurst(this.cx, this.y + 60, '#b58bff', 12, {size:4, speed:150, life:.45, gravity:0, star:true});
    sfx.bossShoot();
  }

  hurt(amount, player){
    if(!this.active || this.dead || this.intro > 0) return;
    this.hp = Math.max(0, this.hp - amount);
    this.flash = .1;
    if(player){
      player.score += 5;
    }
    const hx = this.x + 28 + Math.random() * (this.w - 56);
    const hy = this.y + 30 + Math.random() * (this.h - 40);
    spawnBurst(hx, hy, '#ffe27a', 5, {size:3, speed:140, life:.32, gravity:120, star:true});
    addFloatText(`-${amount}  +5分`, hx, hy - 8, '#ffe36d', 16);
    game.shake = Math.max(game.shake, 2.2);
    sfx.bossHit();

    if(this.hp <= 0){
      this.die(player);
    }
  }

  die(player){
    if(this.dead) return;
    this.dead = true;
    this.deathTimer = 2.9;
    this.deathTick = 0;
    this.chargeWindup = 0;
    this.chargeTime = 0;
    game.shake = 18;
    game.hitFlash = .55;
    game.projectiles = game.projectiles.filter(p => p.kind !== 'boss');
    for(const p of game.players){
      if(!p.dead){
        p.score += 3500;
        p.invuln = 4;
      }
    }
    addFloatText('BOSS 击破！', this.cx, this.y - 16, '#fff1a0', 32);
    spawnBurst(this.cx, this.cy, '#ffd75d', 48, {size:7, speed:340, life:1.3, gravity:180, star:true});
    spawnBurst(this.cx, this.cy, '#b98aff', 32, {size:6, speed:250, life:1.1, gravity:120});
    sfx.victory();
  }
}

/* ------------------------------------------------------------------
   6. 世界构建 / 重开
------------------------------------------------------------------ */
function getSolids(){
  return game.solids;
}

function makeItem(type, x, y, rng){
  return {
    type,
    x,
    y,
    w:type === 'coin' ? 22 : 28,
    h:type === 'coin' ? 22 : 28,
    phase:rng ? rng.next() * Math.PI * 2 : Math.random() * Math.PI * 2,
    taken:false,
    spin:Math.random() * Math.PI * 2
  };
}

function createGame(mode = 'coop', character = 1){
  const seed = (Date.now() ^ Math.floor(Math.random() * 0xffffffff)) >>> 0;
  const rng = makeRng(seed);

  const selectedCharacter = character === 2 ? 2 : 1;
  const players = mode === 'single'
    ? [new Player(selectedCharacter, 150)]
    : [new Player(1, 120), new Player(2, 220)];

  players.forEach((p, index) => {
    p.controls = mode === 'single' ? 1 : (index === 0 ? 1 : 2);
  });

  const grounds = GROUND_SEGMENTS.map((g, i) => ({
    ...g,
    y:GROUND_Y,
    h:180,
    kind:'ground',
    id:`ground${i}`
  }));

  const platforms = PLATFORM_DEFS.map((p, i) => ({
    ...p,
    h:28,
    kind:'platform',
    id:`plat${i}`,
    isMover:false,
    arena:!!p.arena
  }));

  const hiddenBlocks = HIDDEN_DEFS.map((b, i) => ({
    ...b,
    kind:'hidden',
    id:`hidden${i}`,
    revealed:false,
    revealAnim:0
  }));

  const movers = MOVER_DEFS.map((m, i) => {
    const h = m.h || 26;
    const x = m.axis === 'x' ? m.baseX + Math.sin(m.phase) * m.range : m.baseX;
    const y = m.axis === 'y' ? m.y + Math.sin(m.phase) * m.range : m.y;
    return {
      ...m,
      x,
      y,
      h,
      baseY:m.y,
      kind:'mover',
      id:`mover${i}`,
      isMover:true,
      dx:0,
      dy:0,
      prevX:x,
      prevY:y
    };
  });

  const springs = SPRING_DEFS.map((s, i) => ({
    ...s,
    y:GROUND_Y - 28,
    w:54,
    h:28,
    anim:0,
    id:`spring${i}`
  }));

  const enemies = ENEMY_DEFS.map((e, i) => {
    const walker = e.type === 'walker';
    return {
      ...e,
      id:`enemy${i}`,
      alive:true,
      hp:walker ? 40 : 30,
      maxHp:walker ? 40 : 30,
      flash:0,
      baseX:e.x,
      baseY:e.y,
      t:rng.next() * 10,
      phase:e.phase !== undefined ? e.phase : rng.next() * Math.PI * 2,
      dir:rng.next() < .5 ? -1 : 1,
      w:walker ? 38 : 34,
      h:walker ? 34 : 28,
      score:walker ? 120 : 160
    };
  });

  const items = [];

  // 金币串
  for(const g of COIN_GROUPS){
    for(let i = 0; i < g.n; i++){
      items.push(makeItem('coin', g.x + i * g.gap + rng.range(-4, 4), g.y + rng.range(-4, 4), rng));
    }
  }

  // 坑洞上方的金币弧线
  for(const a of COIN_ARCS){
    for(let i = 0; i < a.n; i++){
      const t = a.n === 1 ? .5 : i / (a.n - 1);
      const x = a.x + t * a.width + rng.range(-3, 3);
      const y = a.y - Math.sin(t * Math.PI) * a.peak;
      items.push(makeItem('coin', x, y, rng));
    }
  }

  // 特殊道具：保证星星 / 血包 / 护盾都有，且末段有补给
  const bag = shuffle([
    'star','star','star','star','star','star','star',
    'health','health','health','health','health','health',
    'shield','shield','shield','shield','shield','shield','shield'
  ], rng);

  SPECIAL_SPOTS.forEach((spot, i) => {
    const type = spot.type || bag[i % bag.length];
    items.push(makeItem(type, spot.x + rng.range(-4, 4), spot.y + rng.range(-4, 4), rng));
  });

  // 场景装饰
  const decor = [];
  for(const g of GROUND_SEGMENTS){
    let x = g.x + 70;
    while(x < g.x + g.w - 55){
      const roll = rng.next();
      decor.push({
        type: roll < .33 ? 'flower' : roll < .62 ? 'tuft' : roll < .82 ? 'rock' : 'bush',
        x,
        y:GROUND_Y,
        phase:rng.next() * 6.28,
        color:rng.pick(['#ff99b5','#ffd45d','#fff0a5','#a8ddf0'])
      });
      x += rng.range(115, 235);
    }
  }
  // 几棵树作为近景装饰
  [310, 1580, 2290, 3170, 4660, 5790, 6580, 7250, 7770].forEach((x, i) => {
    decor.push({type:'tree', x, y:GROUND_Y, phase:i * .9, color:'#4fa64f'});
  });

  const boss = new Boss();
  if(mode === 'single'){
    boss.maxHp = 850;
    boss.hp = boss.maxHp;
  }

  const gameObj = {
    seed,
    mode,
    selectedCharacter,
    state:'title',
    stateTime:0,
    time:0,
    elapsed:0,
    cameraX:0,
    cameraTarget:0,
    shake:0,
    hitFlash:0,
    startBanner:0,
    bossBanner:0,
    players,
    grounds,
    platforms,
    hiddenBlocks,
    movers,
    springs,
    enemies,
    items,
    decor,
    boss,
    projectiles:[],
    particles:[],
    floats:[],
    screenFx:[],
    bossActive:false,
    bossDefeated:false,
    result:null,
    deathVictim:null,
    uiHover:null,
    clouds:[],
    bondCd:0
  };

  // solids = 双向实体碰撞（地面/隐藏砖块）
  // oneWays = 单向平台（草地浮台/移动平台）
  gameObj.solids = [
    ...grounds,
    ...hiddenBlocks
  ];
  gameObj.oneWays = [
    ...platforms,
    ...movers
  ];

  // 云朵（屏幕视差坐标）
  for(let i = 0; i < 18; i++){
    gameObj.clouds.push({
      x:rng.range(0, 1700),
      y:rng.range(58, 270),
      s:rng.range(.55, 1.28),
      a:rng.range(.55, .95),
      speed:rng.range(.08, .18)
    });
  }

  return gameObj;
}

function beginGame(mode = lastMode, character = lastCharacter){
  initAudio();
  const chosenMode = mode === 'single' ? 'single' : 'coop';
  const chosenCharacter = character === 2 ? 2 : 1;
  lastMode = chosenMode;
  lastCharacter = chosenCharacter;
  menuState.mode = chosenMode;
  menuState.character = chosenCharacter;
  game = createGame(chosenMode, chosenCharacter);
  game.state = 'playing';
  game.stateTime = 0;
  game.startBanner = 2.0;
  game.cameraX = 0;
  game.cameraTarget = 0;
  keys.clear();
  lastTimestamp = performance.now();
  accumulator = 0;
}

function startFromMenu(){
  beginGame(menuState.mode, menuState.character);
}

function setGameState(next){
  if(!game) return;
  game.state = next;
  game.stateTime = 0;
  keys.clear();
}

function beginGameOver(player){
  if(!game || game.state !== 'playing') return;
  game.deathVictim = player;
  game.shake = 18;
  game.hitFlash = .35;
  setGameState('dying');
  sfx.death();
  spawnBurst(player.cx, player.cy, player.pal.accent, 28, {size:5, speed:260, life:.9, gravity:250, star:true});
}

function triggerVictory(){
  if(!game || game.state !== 'playing') return;
  game.bossDefeated = true;
  setGameState('victory');
  game.result = makeResult('victory');
  game.screenFx.length = 0;
  for(let i = 0; i < 110; i++){
    game.screenFx.push({
      x:Math.random() * W,
      y:-Math.random() * 240 - 20,
      vx:(Math.random() - .5) * 120,
      vy:100 + Math.random() * 160,
      rot:Math.random() * 6.28,
      vr:(Math.random() - .5) * 8,
      w:4 + Math.random() * 8,
      h:7 + Math.random() * 10,
      color:['#ffd45d','#ff8fab','#9fdcff','#b795ff','#fff7b0'][Math.floor(Math.random() * 5)],
      life:5 + Math.random() * 3,
      maxLife:8,
      shape:Math.random() < .3 ? 'star' : 'rect'
    });
  }
  sfx.victory();
}

function makeResult(type){
  const p1 = game.players.find(p => p.id === 1);
  const p2 = game.players.find(p => p.id === 2);
  return {
    type,
    mode:game.mode,
    character:game.selectedCharacter,
    victim:game.deathVictim,
    p1Coins:p1 ? p1.coins : 0,
    p2Coins:p2 ? p2.coins : 0,
    p1Score:p1 ? p1.score : 0,
    p2Score:p2 ? p2.score : 0,
    p1Stars:p1 ? p1.stars : 0,
    p2Stars:p2 ? p2.stars : 0,
    time:game.elapsed,
    enemiesLeft:game.enemies.filter(e => e.alive).length
  };
}

/* ------------------------------------------------------------------
   7. 特效
------------------------------------------------------------------ */
function spawnBurst(x, y, color, count, opts = {}){
  if(!game) return;
  const speed = opts.speed || 150;
  const life = opts.life || .45;
  const size = opts.size || 4;
  const gravity = opts.gravity === undefined ? 270 : opts.gravity;
  for(let i = 0; i < count; i++){
    const a = Math.random() * Math.PI * 2;
    const s = speed * (.35 + Math.random() * .65);
    game.particles.push({
      x, y,
      vx:Math.cos(a) * s,
      vy:Math.sin(a) * s - (opts.up || 0),
      size:size * (.6 + Math.random() * .8),
      color,
      life:life * (.65 + Math.random() * .7),
      maxLife:life,
      gravity,
      rot:Math.random() * 6.28,
      vr:(Math.random() - .5) * 9,
      shape:opts.star || Math.random() < .28 ? 'star' : 'circle',
      screen:false
    });
  }
}

function spawnRing(x, y, color, count){
  if(!game) return;
  for(let i = 0; i < count; i++){
    const a = (i / count) * Math.PI * 2;
    game.particles.push({
      x, y,
      vx:Math.cos(a) * 50,
      vy:Math.sin(a) * 20 - 20,
      size:3,
      color,
      life:.3,
      maxLife:.3,
      gravity:20,
      rot:0,
      vr:0,
      shape:'circle',
      screen:false
    });
  }
}

function addFloatText(text, x, y, color, size = 16){
  if(!game) return;
  if(game.floats.length > 42) game.floats.shift();
  game.floats.push({
    text,
    x,
    y,
    color,
    size,
    life:1.0,
    maxLife:1.0,
    vy:-42
  });
}

function updateEffects(dt){
  for(let i = game.particles.length - 1; i >= 0; i--){
    const p = game.particles[i];
    p.life -= dt;
    if(p.life <= 0){ game.particles.splice(i, 1); continue; }
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += p.gravity * dt;
    p.vx *= .985;
    p.rot += p.vr * dt;
  }
  for(let i = game.floats.length - 1; i >= 0; i--){
    const f = game.floats[i];
    f.life -= dt;
    f.y += f.vy * dt;
    f.vy *= .97;
    if(f.life <= 0) game.floats.splice(i, 1);
  }
  game.shake = Math.max(0, game.shake - dt * 28);
  game.hitFlash = Math.max(0, game.hitFlash - dt * 2.8);
}

function updateScreenFx(dt){
  for(let i = game.screenFx.length - 1; i >= 0; i--){
    const p = game.screenFx[i];
    p.life -= dt;
    if(p.life <= 0){ game.screenFx.splice(i, 1); continue; }
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 30 * dt;
    p.vx += Math.sin((p.y + p.life * 20) * .03) * 4 * dt;
    p.rot += p.vr * dt;
    if(p.y > H + 30) p.y = -20;
  }
}

/* ------------------------------------------------------------------
   8. 主更新逻辑
------------------------------------------------------------------ */
function updateMovers(dt){
  for(const m of game.movers){
    m.prevX = m.x;
    m.prevY = m.y;
    const a = game.time * m.speed + m.phase;
    if(m.axis === 'x'){
      m.x = m.baseX + Math.sin(a) * m.range;
    }else{
      m.y = m.baseY + Math.sin(a) * m.range;
    }
    m.dx = m.x - m.prevX;
    m.dy = m.y - m.prevY;
  }
}

function updateSprings(dt){
  for(const s of game.springs){
    s.anim = Math.max(0, s.anim - dt * 3.2);
    for(const p of game.players){
      if(p.dead) continue;
      const overlap = p.x + p.w > s.x + 4 && p.x < s.x + s.w - 4 &&
                      p.y + p.h >= s.y - 5 && p.y + p.h <= s.y + s.h + 18;
      if(overlap && p.vy >= 0){
        p.y = s.y - p.h - 1;
        p.vy = -SPRING_VELOCITY;
        p.onGround = false;
        p.groundRef = null;
        p.coyote = 0;
        p.jumpCut = false;
        s.anim = 1;
        game.shake = Math.max(game.shake, 2);
        spawnBurst(s.x + s.w / 2, s.y, '#ffd85e', 10, {size:4, speed:150, life:.45, gravity:280});
        sfx.spring();
      }
    }
  }
}

function updateItems(dt){
  for(const item of game.items){
    if(item.taken) continue;
    const bobY = item.y + Math.sin(game.time * 2.6 + item.phase) * 4;
    const box = {x:item.x - item.w / 2, y:bobY - item.h / 2, w:item.w, h:item.h};
    for(const p of game.players){
      if(p.dead) continue;
      if(aabb(p, box)){
        collectItem(item, p);
        break;
      }
    }
  }
}

function collectItem(item, p){
  if(item.taken) return;
  item.taken = true;
  const bx = item.x;
  const by = item.y;

  if(item.type === 'coin'){
    p.coins++;
    p.score += 50;
    addFloatText('+1 金币', bx, by - 12, '#ffd447', 15);
    spawnBurst(bx, by, '#ffd44d', 8, {size:3, speed:120, life:.4, gravity:120, star:true});
    sfx.coin();
  }else if(item.type === 'star'){
    p.stars++;
    p.score += 250;
    const healed = p.heal(10);
    addFloatText(healed > 0 ? '星星 +250  HP +10' : '星星 +250', bx, by - 14, '#ffe466', 16);
    spawnBurst(bx, by, '#ffe66d', 18, {size:5, speed:190, life:.65, gravity:100, star:true});
    sfx.item();
  }else if(item.type === 'health'){
    const healed = p.heal(30);
    p.score += healed > 0 ? 50 : 10;
    addFloatText(healed > 0 ? `生命 +${healed}` : '生命已满', bx, by - 14, '#ff7289', 16);
    spawnBurst(bx, by, '#ff8ca0', 14, {size:4, speed:150, life:.55, gravity:80});
    sfx.health();
  }else if(item.type === 'shield'){
    p.shieldTimer = 8;
    p.score += 120;
    addFloatText('星光护盾 8秒', bx, by - 14, '#8bdcff', 16);
    spawnBurst(bx, by, '#8bdcff', 18, {size:4, speed:170, life:.65, gravity:40, star:true});
    sfx.shield();
  }
}

function updateEnemies(dt){
  for(const e of game.enemies){
    if(!e.alive) continue;
    e.flash = Math.max(0, e.flash - dt);
    e.t += dt;

    if(e.type === 'walker'){
      e.x += e.dir * e.speed * dt;
      if(e.x < e.min){ e.x = e.min; e.dir = 1; }
      if(e.x > e.max){ e.x = e.max; e.dir = -1; }
    }else{
      const t = e.t * e.speed + e.phase;
      e.x = e.baseX + Math.sin(t) * e.rangeX;
      e.y = e.baseY + Math.sin(t * 1.65 + .8) * e.rangeY;
    }

    const box = enemyBox(e);
    for(const p of game.players){
      if(p.dead) continue;
      if(p.invuln > 0 && p.shieldTimer <= 0) continue;
      if(!aabb(p, box)) continue;

      // 踩头攻击
      const falling = p.vy > 140;
      const above = p.y + p.h < box.y + box.h * .55;
      if(falling && above){
        p.vy = -510;
        p.onGround = false;
        damageEnemy(e, 30, p, true);
        game.shake = Math.max(game.shake, 2);
        sfx.stomp();
        break;
      }

      if(p.takeDamage(e.type === 'walker' ? 15 : 12, e.x)){
        // 受伤后在短时间内不再重复判定
      }
      break;
    }
  }
}

function enemyBox(e){
  // 步行怪以脚底为基准，飞行怪以身体中心为基准
  if(e.type === 'flyer'){
    return {x:e.x - e.w / 2, y:e.y - e.h / 2, w:e.w, h:e.h};
  }
  return {x:e.x - e.w / 2, y:e.y - e.h, w:e.w, h:e.h};
}

function damageEnemy(e, dmg, player, stomp = false){
  if(!e.alive) return;
  e.hp -= dmg;
  e.flash = .13;
  spawnBurst(e.x, e.y - e.h / 2, '#c58cff', 6, {size:3, speed:130, life:.35, gravity:220});
  addFloatText(`-${dmg}`, e.x, e.y - e.h - 8, '#ffe36d', 14);

  if(e.hp <= 0){
    e.alive = false;
    if(player){
      player.score += e.score;
    }
    spawnBurst(e.x, e.y - e.h / 2, e.type === 'walker' ? '#b681e8' : '#ff9e5f', 20, {size:5, speed:210, life:.65, gravity:260, star:true});
    addFloatText(`+${e.score}`, e.x, e.y - e.h - 20, '#ffe86d', 17);
    if(Math.random() < .38){
      game.items.push(makeItem('coin', e.x, e.y - e.h / 2, null));
    }
    sfx.enemy();
  }else if(stomp){
    addFloatText('踩！', e.x, e.y - e.h - 22, '#fff4b0', 15);
  }
}

function updateProjectiles(dt){
  for(let i = game.projectiles.length - 1; i >= 0; i--){
    const b = game.projectiles[i];
    b.life -= dt;
    if(b.life <= 0){ game.projectiles.splice(i, 1); continue; }

    b.trail.push({x:b.x, y:b.y});
    if(b.trail.length > 6) b.trail.shift();
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.rot += dt * 9;

    if(b.kind === 'player'){
      let hit = false;
      for(const e of game.enemies){
        if(!e.alive) continue;
        if(aabb({x:b.x - b.r, y:b.y - b.r, w:b.r * 2, h:b.r * 2}, enemyBox(e))){
          const player = b.owner || game.players.find(p => p.id === b.ownerId);
          damageEnemy(e, b.damage, player);
          spawnBurst(b.x, b.y, b.color, 7, {size:3, speed:120, life:.3, gravity:80, star:true});
          hit = true;
          break;
        }
      }
      if(!hit && game.boss && game.boss.active && !game.boss.dead && game.boss.intro <= 0){
        if(aabb({x:b.x - b.r, y:b.y - b.r, w:b.r * 2, h:b.r * 2}, game.boss)){
          game.boss.hurt(b.damage, b.owner || game.players.find(p => p.id === b.ownerId));
          spawnBurst(b.x, b.y, '#fff0a9', 8, {size:3, speed:140, life:.3, gravity:70, star:true});
          hit = true;
        }
      }
      if(hit){ game.projectiles.splice(i, 1); continue; }
    }else{
      let hit = false;
      for(const p of game.players){
        if(p.dead) continue;
        if(aabb({x:b.x - b.r, y:b.y - b.r, w:b.r * 2, h:b.r * 2}, p)){
          p.takeDamage(b.damage, b.x);
          spawnBurst(b.x, b.y, '#b78dff', 10, {size:4, speed:160, life:.4, gravity:70, star:true});
          hit = true;
          break;
        }
      }
      if(hit){ game.projectiles.splice(i, 1); continue; }
    }

    if(b.x < game.cameraX - 300 || b.x > game.cameraX + W + 300 || b.y < -150 || b.y > H + 250){
      game.projectiles.splice(i, 1);
    }
  }
}

function updateBossTrigger(){
  if(game.bossActive || game.boss.dead) return;
  const playersReady = game.players.every(p => !p.dead && p.x > BOSS_TRIGGER);
  if(playersReady){
    game.bossActive = true;
    game.bossBanner = 2.7;
    game.boss.activate();
    addFloatText(game.mode === 'single' ? '击败暗影团子！' : '快一起打败它！', game.boss.cx, game.boss.y - 20, '#fff1a8', 20);
  }
}

function updateCamera(dt){
  let desired;
  if(game.bossActive){
    desired = WORLD_W - W;
  }else{
    const alive = game.players.filter(p => !p.dead);
    const focus = alive.length
      ? alive.reduce((sum, p) => sum + p.cx, 0) / alive.length
      : game.cameraX + W / 2;
    desired = clamp(focus - W * .5, 0, WORLD_W - W);
  }
  game.cameraTarget = desired;
  const k = 1 - Math.exp(-5.2 * dt);
  game.cameraX = lerp(game.cameraX, desired, k);
  game.cameraX = clamp(game.cameraX, 0, WORLD_W - W);
}

function enforceCoopBond(){
  if(game.bossActive || game.players.length < 2) return;
  const a = game.players[0];
  const b = game.players[1];
  if(a.dead || b.dead) return;

  const maxGap = 930;
  let leader = null;
  let follower = null;
  if(b.cx - a.cx > maxGap){
    leader = b;
    follower = a;
  }else if(a.cx - b.cx > maxGap){
    leader = a;
    follower = b;
  }
  if(!leader) return;

  const targetX = follower.cx + (leader === b ? maxGap : -maxGap) - leader.w / 2;
  leader.x = targetX;
  leader.vx = 0;

  if(game.bondCd <= 0){
    game.bondCd = 1.4;
    addFloatText('等等伙伴！', leader.cx, leader.y - 10, '#fff0a2', 15);
    spawnRing(leader.cx, leader.cy, 'rgba(255,229,132,.8)', 8);
  }
}

function checkPits(){
  for(const p of game.players){
    if(p.dead) continue;
    if(p.y > H + 130){
      const safeX = p.lastSafe.x;
      const safeY = p.lastSafe.y;
      p.x = safeX;
      p.y = safeY;
      p.vx = 0;
      p.vy = 0;
      p.onGround = false;
      p.groundRef = null;
      addFloatText('掉下去了！-20', safeX + p.w / 2, safeY - 18, '#ff8b8b', 17);
      const wasHit = p.takeDamage(20, null, true);
      if(!p.dead && wasHit){
        p.x = safeX;
        p.y = safeY - 6;
        p.vx = 0;
        p.vy = 0;
        p.invuln = Math.max(p.invuln, 2.0);
      }
      game.shake = Math.max(game.shake, 5);
    }
  }
}

function updatePlaying(dt){
  game.elapsed += dt;
  game.startBanner = Math.max(0, game.startBanner - dt);
  game.bossBanner = Math.max(0, game.bossBanner - dt);

  updateMovers(dt);
  for(const p of game.players) p.update(dt);
  if(game.state !== 'playing') return;

  updateSprings(dt);
  checkPits();
  if(game.state !== 'playing') return;

  game.bondCd = Math.max(0, game.bondCd - dt);
  enforceCoopBond();
  updateItems(dt);
  updateEnemies(dt);
  if(game.state !== 'playing') return;

  updateProjectiles(dt);
  if(game.state !== 'playing') return;

  updateBossTrigger();
  game.boss.update(dt);
  if(game.state !== 'playing') return;

  updateCamera(dt);
  updateEffects(dt);
}

function updateDying(dt){
  updateEffects(dt);
  for(const p of game.players) p.update(dt);
  game.shake = Math.max(0, game.shake - dt * 18);
  if(game.stateTime > 1.55){
    game.result = makeResult('defeat');
    setGameState('gameover');
  }
}

function updateTitle(dt){
  game.cameraX = 70 + Math.sin(game.time * .18) * 38;
  game.cameraTarget = game.cameraX;
  updateEffects(dt);
}

function updateGame(dt){
  if(!game) return;
  game.time += dt;

  if(game.state === 'title'){
    game.stateTime += dt;
    updateTitle(dt);
    return;
  }

  if(game.state === 'playing'){
    game.stateTime += dt;
    updatePlaying(dt);
    return;
  }

  if(game.state === 'dying'){
    game.stateTime += dt;
    updateDying(dt);
    return;
  }

  if(game.state === 'victory' || game.state === 'gameover'){
    game.stateTime += dt;
    updateScreenFx(dt);
    updateEffects(dt);
    return;
  }

  if(game.state === 'paused'){
    // 暂停时保持画面，不推进世界
    return;
  }
}

/* ------------------------------------------------------------------
   9. 绘制：背景与关卡
------------------------------------------------------------------ */
function drawSky(){
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#65cdfb');
  g.addColorStop(.42, '#9fe4ff');
  g.addColorStop(.78, '#d8f7ff');
  g.addColorStop(1, '#eafbff');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // 太阳与光晕
  const sx = 1080 - (game.cameraX * .018) % 160;
  ctx.save();
  const glow = ctx.createRadialGradient(sx, 102, 12, sx, 102, 125);
  glow.addColorStop(0, 'rgba(255,250,190,.95)');
  glow.addColorStop(.35, 'rgba(255,241,146,.32)');
  glow.addColorStop(1, 'rgba(255,241,146,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(sx - 140, -38, 280, 280);
  ctx.fillStyle = '#fff7b5';
  ctx.beginPath();
  ctx.arc(sx, 102, 40, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.72)';
  ctx.beginPath();
  ctx.arc(sx - 10, 92, 15, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawCloudShape(x, y, s, alpha){
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(x, y);
  ctx.scale(s, s);
  ctx.fillStyle = 'rgba(255,255,255,.94)';
  ctx.beginPath();
  ctx.arc(-36, 8, 22, 0, Math.PI * 2);
  ctx.arc(-10, -5, 31, 0, Math.PI * 2);
  ctx.arc(26, 3, 24, 0, Math.PI * 2);
  ctx.arc(48, 13, 15, 0, Math.PI * 2);
  ctx.arc(7, 16, 27, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = 'rgba(219,246,255,.75)';
  ctx.beginPath();
  ctx.ellipse(-3, 23, 58, 10, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawClouds(){
  for(const c of game.clouds){
    let x = (c.x - game.cameraX * c.speed) % 1600;
    if(x < -260) x += 1600;
    if(x > W + 260) x -= 1600;
    drawCloudShape(x, c.y, c.s, c.a);
  }
}

const MOUNTAIN_PATTERN = [
  {x:40,   w:380, h:190, cap:.60},
  {x:390,  w:430, h:235, cap:.58},
  {x:850,  w:320, h:160, cap:.55},
  {x:1130, w:460, h:250, cap:.60}
];

function drawMountains(){
  const offset = (game.cameraX * .16) % 1400;
  for(let k = -1; k <= 1; k++){
    const base = k * 1400 - offset;
    for(const m of MOUNTAIN_PATTERN){
      const x = base + m.x;
      const y = 505;
      ctx.fillStyle = k === 0 ? '#8bcfb4' : '#87c9ad';
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x + m.w * .5, y - m.h);
      ctx.lineTo(x + m.w, y);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.62)';
      ctx.beginPath();
      ctx.moveTo(x + m.w * .5, y - m.h);
      ctx.lineTo(x + m.w * .5 - m.w * .11, y - m.h * .72);
      ctx.lineTo(x + m.w * .5 - m.w * .03, y - m.h * .75);
      ctx.lineTo(x + m.w * .5 + m.w * .05, y - m.h * .68);
      ctx.lineTo(x + m.w * .5 + m.w * .12, y - m.h * .74);
      ctx.closePath();
      ctx.fill();
    }
  }

  // 远山前的一层浅色丘陵
  const hOff = (game.cameraX * .30) % 690;
  for(let k = -1; k <= 2; k++){
    const x = k * 690 - hOff;
    ctx.fillStyle = k % 2 === 0 ? '#77cc87' : '#6fc57f';
    ctx.beginPath();
    ctx.ellipse(x + 230, 590, 310, 145, 0, Math.PI, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(x + 570, 594, 225, 112, 0, Math.PI, Math.PI * 2);
    ctx.fill();
  }

  // 更近的草地丘陵
  const nOff = (game.cameraX * .48) % 560;
  for(let k = -1; k <= 3; k++){
    const x = k * 560 - nOff;
    ctx.fillStyle = '#5cbd66';
    ctx.beginPath();
    ctx.ellipse(x + 170, 615, 270, 105, 0, Math.PI, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(x + 465, 618, 190, 80, 0, Math.PI, Math.PI * 2);
    ctx.fill();
  }
}

function drawAbyss(){
  const g = ctx.createLinearGradient(0, GROUND_Y - 8, 0, H);
  g.addColorStop(0, 'rgba(25,48,70,.06)');
  g.addColorStop(.24, 'rgba(15,35,55,.40)');
  g.addColorStop(1, 'rgba(7,18,32,.94)');
  ctx.fillStyle = g;
  ctx.fillRect(0, GROUND_Y - 6, W, H - GROUND_Y + 20);

  // 坑洞里的几点幽光
  ctx.save();
  ctx.globalAlpha = .42;
  for(let i = 0; i < 16; i++){
    const x = ((i * 173 - game.cameraX * .6) % (W + 100) + W + 100) % (W + 100) - 50;
    const y = 646 + (i * 37) % 60;
    ctx.fillStyle = i % 2 ? '#7cc7e8' : '#8ca6ff';
    ctx.beginPath();
    ctx.arc(x, y, 1.2 + (i % 3) * .6, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function drawGround(g){
  if(g.x > game.cameraX + W + 100 || g.x + g.w < game.cameraX - 100) return;

  // 泥土主体
  ctx.fillStyle = '#b9754d';
  ctx.fillRect(g.x, g.y, g.w, g.h + 60);

  // 边缘阴影
  const eg = ctx.createLinearGradient(0, g.y + 12, 0, g.y + 150);
  eg.addColorStop(0, '#c48358');
  eg.addColorStop(1, '#a45c3e');
  ctx.fillStyle = eg;
  ctx.fillRect(g.x, g.y + 12, g.w, g.h);

  // 砖纹
  const startX = Math.max(g.x, game.cameraX - 60);
  const endX = Math.min(g.x + g.w, game.cameraX + W + 60);
  ctx.save();
  ctx.strokeStyle = 'rgba(117,60,43,.36)';
  ctx.lineWidth = 1.4;
  for(let yy = g.y + 47; yy < H + 40; yy += 31){
    const row = Math.floor((yy - g.y) / 31);
    const offset = row % 2 ? 20 : 0;
    const sx = Math.floor((startX - g.x) / 41) * 41 + g.x;
    for(let xx = sx - 41; xx < endX + 41; xx += 41){
      const x = xx + offset;
      ctx.beginPath();
      ctx.moveTo(x, yy);
      ctx.lineTo(x + 38, yy);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x + 19, yy - 31);
      ctx.lineTo(x + 19, yy);
      ctx.stroke();
    }
  }
  ctx.restore();

  // 草皮
  ctx.fillStyle = '#55b94f';
  ctx.fillRect(g.x, g.y, g.w, 16);
  ctx.fillStyle = '#7bd461';
  ctx.fillRect(g.x, g.y, g.w, 7);
  ctx.fillStyle = '#a1e47b';
  ctx.fillRect(g.x, g.y, g.w, 3);

  // 草尖
  ctx.save();
  ctx.fillStyle = '#69c956';
  for(let x = startX + 3; x < endX; x += 13){
    const h = 5 + Math.sin(x * .23) * 2.5;
    ctx.beginPath();
    ctx.moveTo(x, g.y + 3);
    ctx.quadraticCurveTo(x + 3, g.y - h, x + 6, g.y + 2);
    ctx.fill();
  }
  ctx.restore();

  // 两端断崖
  ctx.fillStyle = 'rgba(91,48,34,.36)';
  ctx.fillRect(g.x, g.y + 14, 8, g.h);
  ctx.fillRect(g.x + g.w - 8, g.y + 14, 8, g.h);
}

function drawGrounds(){
  for(const g of game.grounds) drawGround(g);
}

function drawPlatform(p){
  if(p.x > game.cameraX + W + 80 || p.x + p.w < game.cameraX - 80) return;

  const arena = p.arena;
  const base = arena ? '#67558e' : '#bb7b51';
  const top = arena ? '#8468b8' : '#58bc51';
  const dark = arena ? '#4b3b6c' : '#9b5d3a';

  ctx.save();
  ctx.shadowColor = 'rgba(48,33,28,.20)';
  ctx.shadowBlur = 8;
  ctx.shadowOffsetY = 4;

  roundRectPath(p.x, p.y + 3, p.w, p.h + 14, 8);
  ctx.fillStyle = dark;
  ctx.fill();

  roundRectPath(p.x, p.y, p.w, p.h + 11, 7);
  ctx.fillStyle = base;
  ctx.fill();

  ctx.shadowColor = 'transparent';

  // 石砖 / 木纹
  if(arena){
    ctx.strokeStyle = 'rgba(48,32,80,.44)';
    ctx.lineWidth = 1.4;
    for(let x = p.x + 22; x < p.x + p.w; x += 31){
      ctx.beginPath();
      ctx.moveTo(x, p.y + 4);
      ctx.lineTo(x + 7, p.y + p.h + 9);
      ctx.stroke();
    }
    roundRectPath(p.x, p.y, p.w, 10, 4);
    ctx.fillStyle = top;
    ctx.fill();
    ctx.fillStyle = 'rgba(206,178,255,.55)';
    ctx.fillRect(p.x + 5, p.y + 1, p.w - 10, 2.5);
  }else{
    ctx.strokeStyle = 'rgba(118,64,38,.35)';
    ctx.lineWidth = 1.2;
    for(let x = p.x + 20; x < p.x + p.w; x += 26){
      ctx.beginPath();
      ctx.moveTo(x, p.y + 15);
      ctx.lineTo(x + 4, p.y + p.h + 9);
      ctx.stroke();
    }
    // 草皮
    roundRectPath(p.x - 1, p.y - 2, p.w + 2, 12, 5);
    ctx.fillStyle = top;
    ctx.fill();
    ctx.fillStyle = '#83d76b';
    ctx.fillRect(p.x + 3, p.y - 2, p.w - 6, 3.5);
    ctx.fillStyle = '#a6e681';
    for(let x = p.x + 8; x < p.x + p.w - 5; x += 15){
      ctx.beginPath();
      ctx.arc(x, p.y - 2.5, 2.2, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // 小铆钉
  ctx.fillStyle = arena ? 'rgba(223,199,255,.55)' : 'rgba(255,235,198,.60)';
  for(let x = p.x + 12; x < p.x + p.w - 8; x += 26){
    ctx.beginPath();
    ctx.arc(x, p.y + p.h + 5, 1.8, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function drawMover(m){

function drawSpring(s){
  if(s.x > game.cameraX + W + 50 || s.x + s.w < game.cameraX - 50) return;
  const compress = s.anim * 10;
  const baseY = s.y + s.h;

  // 底座
  fillRoundRect(s.x + 3, baseY - 7, s.w - 6, 8, 4, '#7b5b47');
  // 弹簧
  ctx.save();
  ctx.strokeStyle = '#d7a53b';
  ctx.lineWidth = 3;
  ctx.beginPath();
  const topY = s.y + 7 + compress;
  for(let i = 0; i < 3; i++){
    const y = baseY - 11 - i * ((baseY - 12 - topY) / 3);
    ctx.moveTo(s.x + 12, y);
    ctx.lineTo(s.x + s.w - 12, y - 5);
  }
  ctx.stroke();
  ctx.restore();

  // 弹簧顶板
  fillRoundRect(s.x + 5, topY, s.w - 10, 11, 5, '#ff6464');
  fillRoundRect(s.x + 9, topY + 2, s.w - 18, 3, 2, '#ffb2a7');
  ctx.save();
  ctx.fillStyle = '#ffdd70';
  starPath(s.x + s.w / 2, topY + 5.5, 3.5, 1.4, 5, game.time * 1.8);
  ctx.fill();
  ctx.restore();
}

function drawDecorItem(d){
  if(d.x > game.cameraX + W + 80 || d.x < game.cameraX - 80) return;
  const sway = Math.sin(game.time * 1.8 + d.phase) * 2;
  ctx.save();
  ctx.translate(d.x, d.y);
  if(d.type === 'flower'){
    ctx.strokeStyle = '#4aa64a';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(sway, -8, sway, -16);
    ctx.stroke();
    ctx.fillStyle = d.color;
    for(let i = 0; i < 5; i++){
      const a = (i / 5) * Math.PI * 2;
      ctx.beginPath();
      ctx.arc(sway + Math.cos(a) * 4, -16 + Math.sin(a) * 4, 3.8, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = '#ffd85a';
    ctx.beginPath();
    ctx.arc(sway, -16, 2.5, 0, Math.PI * 2);
    ctx.fill();
  }else if(d.type === 'tuft'){
    ctx.fillStyle = '#4fae4b';
    for(let i = -2; i <= 2; i++){
      ctx.beginPath();
      ctx.moveTo(i * 4, 0);
      ctx.quadraticCurveTo(i * 4 + sway, -9 - Math.abs(i) * 3, i * 4 + sway * 1.4, -14 - Math.abs(i) * 3);
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#4fae4b';
      ctx.stroke();
    }
  }else if(d.type === 'rock'){
    ctx.fillStyle = '#97a09c';
    ctx.beginPath();
    ctx.ellipse(0, -6, 10, 7, -.15, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#b8c0bc';
    ctx.beginPath();
    ctx.ellipse(-2, -8, 6, 3.5, -.2, 0, Math.PI * 2);
    ctx.fill();
  }else if(d.type === 'bush'){
    ctx.fillStyle = '#4cad50';
    ctx.beginPath();
    ctx.arc(-12, -6, 12, 0, Math.PI * 2);
    ctx.arc(2, -12, 16, 0, Math.PI * 2);
    ctx.arc(16, -5, 11, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#6fc86a';
    ctx.beginPath();
    ctx.arc(-5, -15, 6, 0, Math.PI * 2);
    ctx.fill();
  }else if(d.type === 'tree'){
    ctx.fillStyle = '#8a5a38';
    ctx.fillRect(-6, -74, 12, 76);
    ctx.fillStyle = '#3d9447';
    ctx.beginPath();
    ctx.arc(-21, -83, 29, 0, Math.PI * 2);
    ctx.arc(18, -91, 34, 0, Math.PI * 2);
    ctx.arc(3, -112, 31, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#62b95d';
    ctx.beginPath();
    ctx.arc(-12, -105, 16, 0, Math.PI * 2);
    ctx.arc(23, -98, 13, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

   10. 绘制：角色 / 敌人 / BOSS / 道具
------------------------------------------------------------------ */
function drawSpritePlayer(p, centerX, feetY, scale, opts, anim){
  const sprite = PLAYER_SPRITES[p.id];
  if(!sprite || !sprite.ready) return false;

  const pal = p.pal;
  const {alpha, dead, bob, airborne, crouch, moving, hurt, t, walk} = anim;

  // 地面阴影
  ctx.save();
  ctx.globalAlpha = alpha * (airborne ? .08 : .16);
  ctx.fillStyle = '#27352c';
  ctx.beginPath();
  ctx.ellipse(centerX, feetY + 4, 31 * scale, 7.5 * scale, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // 直接使用参考图抠出的透明角色图，不再手绘近似
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(centerX, feetY + bob - (hurt ? Math.sin(t * 70) * 1.8 : 0));
  ctx.scale(scale * p.facing, scale);

  if(dead){
    const d = clamp(p.deathT / 1.05, 0, 1);
    ctx.rotate(p.facing * d * 1.35);
    ctx.scale(1 - d * .18, 1 - d * .18);
    ctx.translate(0, d * 7);
  }

  if(moving && !dead) ctx.rotate(Math.sin(walk) * .022);

  const sx = crouch ? 1.08 : (airborne ? .98 : 1);
  const sy = crouch ? .82 : (airborne ? 1.03 : 1 + (moving ? Math.abs(Math.sin(walk)) * .014 : 0));
  const pulse = p.attackAnim > 0 ? 1.035 : 1;
  ctx.scale(sx * pulse, sy * pulse);

  const h = 92;
  const w = h * (sprite.aspect || 1);
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(sprite.img, -w / 2, -h, w, h);

  if(p.attackAnim > 0){
    ctx.fillStyle = pal.accent;
    starPath(w * .40, -h * .53, 6, 2.5, 5, t * 8);
    ctx.fill();
  }

  if(hurt){
    ctx.save();
    ctx.fillStyle = '#ffd659';
    for(let i = 0; i < 3; i++){
      const a = t * 7 + i * 2.1;
      starPath(Math.cos(a) * w * .32, -h * .82 + Math.sin(a) * 7, 3.5, 1.4, 5, a);
      ctx.fill();
    }
    ctx.restore();
  }
  ctx.restore();

  // 星光护盾
  if(p.shieldTimer > 0 && !dead){
    ctx.save();
    const pulseR = 1 + Math.sin(t * 6) * .035;
    const cy = feetY - 45 * scale;
    const r = 51 * scale * pulseR;
    const g = ctx.createRadialGradient(centerX, cy, r * .35, centerX, cy, r);
    g.addColorStop(0, 'rgba(149,231,255,0)');
    g.addColorStop(.72, 'rgba(137,220,255,.11)');
    g.addColorStop(1, 'rgba(169,239,255,.36)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(centerX, cy, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(217,249,255,.90)';
    ctx.lineWidth = 2.2;
    ctx.setLineDash([7, 7]);
    ctx.lineDashOffset = -t * 22;
    ctx.beginPath();
    ctx.arc(centerX, cy, r, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
    for(let i = 0; i < 3; i++){
      const a = t * 1.8 + i * 2.09;
      ctx.fillStyle = 'rgba(233,254,255,.9)';
      starPath(centerX + Math.cos(a) * r, cy + Math.sin(a) * r, 3.4, 1.3, 4, a);
      ctx.fill();
    }
    ctx.restore();
  }

  // 名字气泡
  if(!dead && opts.label !== false){
    const labelY = feetY - 115 * scale + bob;
    const labelW = 52 * scale;
    const labelH = 22 * scale;
    const lx = centerX - labelW / 2;
    const ly = labelY - labelH / 2;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.shadowColor = 'rgba(57,39,31,.18)';
    ctx.shadowBlur = 7;
    fillRoundRect(lx, ly, labelW, labelH, 9 * scale, 'rgba(255,251,240,.94)');
    ctx.shadowColor = 'transparent';
    strokeRoundRect(lx, ly, labelW, labelH, 9 * scale, p.id === 1 ? '#e6b8c5' : '#d6ad83', 1.8);
    ctx.beginPath();
    ctx.moveTo(centerX - 5 * scale, ly + labelH);
    ctx.lineTo(centerX, ly + labelH + 6 * scale);
    ctx.lineTo(centerX + 5 * scale, ly + labelH);
    ctx.closePath();
    ctx.fillStyle = 'rgba(255,251,240,.94)';
    ctx.fill();
    ctx.fillStyle = p.id === 1 ? '#4a3034' : '#5a3827';
    ctx.font = `800 ${13.5 * scale}px ${FONT}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(p.name, centerX, ly + labelH / 2 + .5);
    ctx.fillStyle = pal.accent;
    ctx.beginPath();
    ctx.arc(lx + labelW - 8 * scale, ly + 7 * scale, 2.4 * scale, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  return true;
}

function drawPlayerFigure(p, centerX, feetY, scale = 1, opts = {}){
  const pal = p.pal;
  const dead = opts.dead !== undefined ? opts.dead : p.dead;
  const t = game.time;
  const walk = p.walkPhase;
  const moving = Math.abs(p.vx) > 20 && p.onGround;
  const airborne = !p.onGround;
  const crouch = p.crouch && p.onGround;
  const hurt = p.hurtTimer > 0;
  const invulnBlink = p.invuln > 0 && !dead && !opts.noBlink && Math.floor(t * 20) % 2 === 0;
  let alpha = opts.alpha === undefined ? 1 : opts.alpha;
  if(invulnBlink) alpha *= .36;
  if(dead) alpha *= clamp(1 - p.deathT / 1.05, 0, 1);
  if(alpha <= .01) return;

  const bob = p.onGround ? Math.sin(t * 3.4 + p.id * 1.7) * (moving ? .8 : 1.6) : 0;
  const squashY = crouch ? .82 : airborne ? 1.035 : 1;
  const squashX = crouch ? 1.09 : airborne ? .975 : 1;
  const legSwing = moving ? Math.sin(walk) * 7 : 0;
  const armSwing = moving ? Math.sin(walk + Math.PI) * 6 : Math.sin(t * 2.2 + p.id) * 1.6;

  // 有参考图精灵时优先使用原图；加载失败才回退到矢量近似
  if(drawSpritePlayer(p, centerX, feetY, scale, opts, {alpha, dead, bob, airborne, crouch, moving, hurt, t, walk})){

  // 影子
  ctx.save();
  ctx.globalAlpha = alpha * (airborne ? .08 : .15);

  ctx.beginPath();
  ctx.ellipse(centerX, feetY + 4, 27 * scale, 7 * scale, 0, 0, Math.PI * 2);

  ctx.globalAlpha = alpha;
  ctx.translate(centerX, feetY + bob - (hurt ? Math.sin(t * 70) * 1.8 : 0));

  if(dead){

  // 一二背后的黄色长棍

  // 短短的圆脚（一二穿深色小鞋）
  const legLiftL = moving ? Math.max(0, Math.sin(walk)) * 3.3 : 0;
  const legLiftR = moving ? Math.max(0, -Math.sin(walk)) * 3.3 : 0;
  const footY = airborne ? -6.4 : -4;
  ctx.fillStyle = p.id === 1 ? pal.shoe : pal.body;
  ctx.strokeStyle = pal.outline;
  ctx.lineWidth = 2.2;
  ctx.beginPath();
  ctx.ellipse(-8 + legSwing, footY - legLiftL, 7.3, 4.4, -.05, 0, Math.PI * 2);

  // 梨形的软乎乎小身体
  ctx.fillStyle = pal.body;

  // 一二的橙色小裙摆
  if(p.id === 1){

  // 布布肩上的黑色披风
  if(p.id === 2){

  // 圆滚滚的小手臂：覆盖身体接缝，只描外轮廓，看起来像是长在身体上
  const attacking = p.attackAnim > 0;
  const armY = airborne ? -29 : -21;
  const armSwingL = armSwing * .38;
  const armSwingR = -armSwing * .38;
  const pawX = 19.8 + (attacking ? 8 : 0);

  ctx.beginPath();

  if(attacking){
    ctx.fillStyle = pal.accent;
    starPath(pawX + 7.5, armRY - 4, 5.8, 2.5, 5, t * 8);
    ctx.fill();
  }

  // 布布的浅蓝色小剑与白色布带
  if(p.id === 2){
    ctx.save();
    ctx.translate(0, -31);
    ctx.rotate(-.04);
    ctx.fillStyle = pal.sword;
    ctx.strokeStyle = pal.outline;
    ctx.lineWidth = 2.1;
    ctx.beginPath();
    ctx.moveTo(-37, -4.5);
    ctx.quadraticCurveTo(-40, 0, -37, 4.5);
    ctx.lineTo(-8, 3.2);
    ctx.lineTo(-8, -3.2);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.strokeStyle = pal.swordEdge;
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(-32, -2.1);
    ctx.lineTo(-12, -2.1);
    ctx.stroke();
    ctx.fillStyle = '#674536';
    ctx.strokeStyle = pal.outline;
    ctx.lineWidth = 1.8;
    roundRectPath(-9, -3.5, 10, 7, 3);
    ctx.fill();
    ctx.stroke();
    ctx.restore();

    ctx.fillStyle = pal.cloth;
    ctx.strokeStyle = pal.outline;
    ctx.lineWidth = 2.1;
    ctx.beginPath();
    ctx.moveTo(7, -34);
    ctx.bezierCurveTo(16, -35.5, 24, -31, 28.5, -25);
    ctx.quadraticCurveTo(31, -21.5, 27, -20.5);
    ctx.bezierCurveTo(22, -24, 17, -24, 11, -28);
    ctx.closePath();
    ctx.fill();

  }

  // 兜帽的外层与内衬
  if(p.id === 1){
    ctx.fillStyle = pal.hoodOuter;
    ctx.strokeStyle = pal.outline;

    ctx.beginPath();
    ctx.ellipse(0, -51, 30.5, 28.5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = pal.hoodInner;
    ctx.beginPath();
    ctx.ellipse(0, -50.5, 27.7, 26.2, 0, 0, Math.PI * 2);
    ctx.fill();
    // 兜帽顶端的青色小星
    ctx.fillStyle = pal.hoodOuter;
    ctx.strokeStyle = pal.outline;
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.moveTo(-7, -77);
    ctx.quadraticCurveTo(-10, -84, -3.5, -84.5);
    ctx.quadraticCurveTo(0, -89, 3.5, -84.5);
    ctx.quadraticCurveTo(10, -84, 7, -77);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = pal.hoodInner;
    ctx.strokeStyle = pal.outline;
    ctx.lineWidth = 1.7;
    starPath(0, -83.5, 7.2, 3.2, 5, -Math.PI / 2);
    ctx.fill();
    ctx.stroke();
  }else{
    ctx.fillStyle = pal.hoodOuter;
    ctx.strokeStyle = pal.outline;
    ctx.lineWidth = 2.7;
    ctx.beginPath();
    ctx.ellipse(0, -51, 30.5, 28.8, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = pal.hoodInner;
    ctx.beginPath();
    ctx.ellipse(0, -50.5, 27.6, 26.1, 0, 0, Math.PI * 2);
    ctx.fill();
    // 布布兜帽顶端的黄色小冠
    ctx.fillStyle = pal.hoodInner;
    ctx.strokeStyle = pal.outline;
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.moveTo(-8, -75);
    ctx.lineTo(-10, -84);
    ctx.quadraticCurveTo(-4.5, -82, -1, -88.5);
    ctx.quadraticCurveTo(2.5, -82, 9, -84.5);
    ctx.lineTo(7.5, -75);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  }

  // 圆圆的耳朵：布布的耳罩是粉色的
  ctx.fillStyle = p.id === 1 ? pal.ear : pal.hoodEar;
  ctx.strokeStyle = pal.outline;
  ctx.lineWidth = 2.2;
  const earR = p.id === 1 ? 8.3 : 7.8;
  const earX = 20.3;
  ctx.beginPath();
  ctx.arc(-earX, -67.5, earR, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(earX, -67.5, earR, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = p.id === 1 ? pal.earInner : '#ffc4c6';
  ctx.beginPath();
  ctx.arc(-earX, -67.1, p.id === 1 ? 3.7 : 3.6, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(earX, -67.1, p.id === 1 ? 3.7 : 3.6, 0, Math.PI * 2);
  ctx.fill();

  // 大圆脑袋，占身体的一半以上
  ctx.fillStyle = pal.body;
  ctx.strokeStyle = pal.outline;
  ctx.lineWidth = 2.6;
  ctx.beginPath();
  ctx.ellipse(0, -51, 24.5, 22.5, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  // 兜帽盖住头顶的帽檐
  ctx.fillStyle = pal.hoodOuter;
  ctx.beginPath();
  ctx.moveTo(-24.5, -55);
  ctx.bezierCurveTo(-26, -69, -16, -74.4, 0, -74.4);
  ctx.bezierCurveTo(16, -74.4, 26, -69, 24.5, -55);
  ctx.quadraticCurveTo(12, -61, 0, -62);
  ctx.quadraticCurveTo(-12, -61, -24.5, -55);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = pal.outline;
  ctx.lineWidth = 2.1;
  ctx.beginPath();
  ctx.moveTo(-24.5, -55);
  ctx.quadraticCurveTo(-12, -61, 0, -62);
  ctx.quadraticCurveTo(12, -61, 24.5, -55);
  ctx.stroke();
  ctx.strokeStyle = pal.hoodInner;
  ctx.lineWidth = 4.2;
  ctx.beginPath();
  ctx.moveTo(-22.3, -58.2);
  ctx.quadraticCurveTo(-10, -63.8, 0, -64.5);
  ctx.quadraticCurveTo(10, -63.8, 22.3, -58.2);
  ctx.stroke();

  // 大块、柔软的腮红
  ctx.save();
  ctx.globalAlpha = alpha * .82;
  ctx.fillStyle = pal.blush;
  ctx.beginPath();
  ctx.ellipse(-15.5, -43, 6.8, 4.2, -.06, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(15.5, -43, 6.8, 4.2, .06, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // 一二参考图里的神气小眉毛
  const eyeColor = p.id === 1 ? '#2d2321' : '#3b231b';
  if(p.id === 1){
    ctx.strokeStyle = eyeColor;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-14, -60.8);
    ctx.lineTo(-6.5, -58.9);
    ctx.moveTo(14, -60.8);
    ctx.lineTo(6.5, -58.9);
    ctx.stroke();
  }

  // 眼睛：参考图里的圆润黑豆眼
  if(blink){
    ctx.strokeStyle = eyeColor;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-13, -52.5);
    ctx.quadraticCurveTo(-9.5, -50.7, -6, -52.5);
    ctx.moveTo(6, -52.5);
    ctx.quadraticCurveTo(9.5, -50.7, 13, -52.5);
    ctx.stroke();
  }else{
    ctx.fillStyle = eyeColor;
    ctx.beginPath();
    ctx.ellipse(-9.4, -52.5, 3.7, 5.15, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(9.4, -52.5, 3.7, 5.15, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.92)';
    ctx.beginPath();
    ctx.arc(-10.3, -54.4, 1.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(8.5, -54.4, 1.2, 0, Math.PI * 2);
    ctx.fill();
  }

  // 一二的“w”形小嘴
  if(p.id === 1){
    ctx.strokeStyle = '#2d2321';
    ctx.lineWidth = 2.1;
    ctx.beginPath();
    ctx.moveTo(-5.4, -40.7);
    ctx.quadraticCurveTo(-2.8, -37.7, 0, -40.7);
    ctx.quadraticCurveTo(2.8, -37.7, 5.4, -40.7);
    ctx.stroke();
  }else{
    // 布布吐舌头的小嘴
    ctx.fillStyle = '#543026';
    ctx.beginPath();
    ctx.moveTo(-5.3, -42.5);
    ctx.bezierCurveTo(-5.8, -35.2, -3.2, -32.6, 0, -32.6);
    ctx.bezierCurveTo(3.2, -32.6, 5.8, -35.2, 5.3, -42.5);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#f0939a';
    ctx.beginPath();
    ctx.ellipse(0, -35.3, 3.2, 2.5, 0, 0, Math.PI * 2);
